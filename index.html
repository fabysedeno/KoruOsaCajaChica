<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja Chica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --forest-900:#2E3010;
  --forest-700:#4D5414;
  --sage-600:#6E7526;
  --sage-500:#8B9142;
  --sage-100:#E8E9D6;
  --sage-50:#F3F4EA;
  --parchment:#F7F5EC;
  --card:#FFFFFF;
  --gold-700:#8C6A2E;
  --gold-600:#B98B3E;
  --gold-100:#F3E6CB;
  --brick-700:#7C332C;
  --brick-600:#A6453D;
  --brick-100:#F5DEDC;
  --ink-900:#201F16;
  --ink-700:#3A3930;
  --ink-500:#75736A;
  --line:#DDD8C4;
  --radius:10px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--ink-900);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
.app{max-width:1180px;margin:0 auto;padding:0 24px 64px;}

/* ---- header ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:28px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1{font-size:22px;font-weight:600;margin:0;color:var(--forest-900);letter-spacing:.2px;}
.brand span{display:block;font-size:12.5px;color:var(--ink-500);margin-top:1px;}
.role-pill{
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--forest-700);
  background:var(--sage-50);border:1px solid var(--sage-100);padding:7px 14px;border-radius:100px;
}
.role-pill button{
  background:none;border:none;color:var(--brick-700);font-size:12.5px;cursor:pointer;
  text-decoration:underline;padding:0;font-family:inherit;
}
@media(max-width:640px){
  .topbar{flex-wrap:wrap;row-gap:12px;}
  .role-pill{width:100%;justify-content:space-between;flex-wrap:wrap;}
}

/* ---- fern mark ---- */
.fern{flex-shrink:0;}

/* ---- generic ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:820px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.metric-label{font-size:12.5px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
.metric-value{font-size:26px;font-weight:600;font-family:'Fraunces',serif;margin:0;color:var(--forest-900);}
.metric-sub{font-size:12.5px;color:var(--ink-500);margin-top:4px;}

.section-title{
  font-size:15px;font-weight:600;color:var(--forest-900);
  display:flex;align-items:center;gap:8px;margin:0 0 14px;
}
.section-title .dot{width:6px;height:6px;border-radius:50%;background:var(--sage-500);}

button.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  border-radius:8px;padding:10px 18px;border:1px solid transparent;
}
.btn-primary{background:var(--forest-900);color:#fff;}
.btn-primary:hover{background:var(--forest-700);}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink-700);}
.btn-secondary:hover{border-color:var(--sage-500);color:var(--sage-600);}
.btn-danger{background:#fff;border:1px solid var(--brick-100);color:var(--brick-700);}

input,select,textarea{
  font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink-900);width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage-500);box-shadow:0 0 0 3px var(--sage-50);}
label{font-size:12.5px;color:var(--ink-700);font-weight:600;display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-500);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);
}
td{padding:10px 10px;border-bottom:1px solid var(--sage-50);color:var(--ink-900);}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;}
.tag-ok{background:var(--sage-100);color:var(--sage-600);}
.tag-warn{background:var(--brick-100);color:var(--brick-700);}
.tag-gold{background:var(--gold-100);color:var(--gold-700);}

.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{
  padding:10px 4px;margin-right:20px;font-size:13.5px;font-weight:600;color:var(--ink-500);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--forest-900);border-bottom-color:var(--sage-500);}

.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.bar-label{width:110px;font-size:13px;color:var(--ink-700);flex-shrink:0;}
.bar-track{flex:1;background:var(--sage-50);border-radius:6px;height:10px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:6px;background:var(--sage-500);}
.bar-fill.over{background:var(--brick-600);}
.bar-fill.atencion{background:var(--gold-600);}
.bar-amt{width:220px;text-align:right;font-size:12.5px;color:var(--ink-500);flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;}

.modal-bg{
  position:fixed;inset:0;background:rgba(22,40,31,.35);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal{background:#fff;border-radius:14px;padding:26px 28px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}

.center-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.choice-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;
  width:280px;text-align:center;cursor:pointer;transition:border-color .15s;
}
.choice-card:hover{border-color:var(--sage-500);}
.choice-card h3{margin:14px 0 6px;font-size:17px;}
.choice-card p{margin:0;font-size:13px;color:var(--ink-500);line-height:1.5;}

.note-item{
  border-left:3px solid var(--brick-600);background:var(--brick-100);border-radius:0 8px 8px 0;
  padding:12px 14px;margin-bottom:10px;font-size:13.5px;
}
.note-item .meta{font-size:12px;color:var(--brick-700);font-weight:600;margin-bottom:4px;}

.empty{
  text-align:center;padding:40px 20px;color:var(--ink-500);font-size:13.5px;
}
.badge-count{
  background:var(--brick-600);color:#fff;font-size:11px;font-weight:700;
  border-radius:100px;padding:1px 7px;margin-left:6px;
}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--forest-900);color:#fff;padding:11px 20px;border-radius:100px;
  font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.show{opacity:1;}
.hidden{display:none !important;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.small-muted{font-size:12px;color:var(--ink-500);}
.link-btn{background:none;border:none;color:var(--sage-600);font-weight:600;font-size:13px;cursor:pointer;padding:0;font-family:inherit;}

/* --------- Reporte de impresión / PDF (se muestra solo al imprimir) --------- */
#print-area{display:none;}
#print-area h1{font-size:20px;margin:0 0 2px;font-family:Georgia,'Times New Roman',serif;}
#print-area .rp-meta{font-size:12.5px;color:#555;margin-bottom:22px;}
#print-area h2{font-size:15px;margin:22px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px;font-family:Georgia,'Times New Roman',serif;}
#print-area table.rp-tabla{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px;}
#print-area table.rp-tabla th{background:#EEEDE4;text-align:left;padding:5px 7px;border:1px solid #ccc;}
#print-area table.rp-tabla td{padding:5px 7px;border:1px solid #ddd;}
#print-area tr.rp-total td{font-weight:bold;background:#F5F4EC;}
#print-area .rp-pagebreak{page-break-after:always;}
@media print{
  body > *:not(#print-area){display:none !important;}
  #print-area{display:block !important;position:static;margin:20px;font-family:Georgia,'Times New Roman',serif;color:#20201B;}
}
</style>
</head>

function nivelAlerta(gastado, disponible){
  if(disponible<=0) return gastado>0 ? "sobregasto" : "ok";
  const pct = gastado/disponible;
  if(pct >= 1) return "sobregasto";
  if(pct >= 0.9) return "atencion";
  return "ok";
}
function tagAlerta(gastado, disponible){
  const nivel = nivelAlerta(gastado, disponible);
  const pct = disponible>0 ? Math.round((gastado/disponible)*100) : (gastado>0?100:0);
  if(nivel==="sobregasto") return `<span class="tag tag-warn">Sobregasto</span>`;
  if(nivel==="atencion") return `<span class="tag" style="background:var(--gold-100);color:var(--gold-700);">${pct}% usado</span>`;
  return "";
}

// Modo "nube": APP_CONFIG.APPS_SCRIPT_URL definido -> lee/escribe en la Hoja de Google.
// Modo "local": sin URL -> usa localStorage (solo para desarrollo en tu equipo).
let modoAlmacen = "nube";

const URL_LOCAL_KEY = "cc_apps_script_url";
let dbVersion = 0; // versión de la base leída de la nube (candado contra choques de escritura)
let servidorAntiguo = false; // true si el Apps Script publicado no es la versión nueva (falta publicar "Nueva versión")
async function fetchJSON(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms || 35000);
  try{
    let r, txt;
    try{
      r = await fetch(url, Object.assign({ signal: ctrl.signal }, opts));
      txt = await r.text();
    }catch(e){
      throw new Error(e.name === "AbortError" ? "El servidor tardó demasiado en responder." : "Sin conexión con el servidor.");
    }
    try{ return JSON.parse(txt); }
    catch(e){ throw new Error("El servidor no devolvió datos válidos. Revisa que la implementación de Apps Script esté publicada para \"Cualquier usuario\" y que la URL termine en /exec."); }
  }finally{ clearTimeout(t); }
}
const API = {
  // Prioridad: URL guardada en este dispositivo desde Ajustes > APP_CONFIG del despliegue
  url(){
    let guardada = "";
    try{ guardada = (localStorage.getItem(URL_LOCAL_KEY) || "").trim(); }catch(e){}
    return guardada || ((window.APP_CONFIG && window.APP_CONFIG.APPS_SCRIPT_URL) || "").trim();
  },
  token(){ return ((window.APP_CONFIG && window.APP_CONFIG.API_TOKEN) || "").trim(); },
  async get(action, urlManual){
    const u = new URL(urlManual || this.url());
    u.searchParams.set("action", action);
    if(this.token()) u.searchParams.set("token", this.token());
    const j = await fetchJSON(u.toString(), { method: "GET", redirect: "follow" }, 35000);
    if(!j.ok) throw new Error(j.error || "Error del servidor");
    return j;
  },
  async post(payload, urlManual){
    // text/plain evita el preflight CORS, que Apps Script no soporta
    const j = await fetchJSON(urlManual || this.url(), {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: this.token() }, payload))
    }, payload.action === "parseTicket" ? 90000 : 35000);
    if(!j.ok){
      const err = new Error(j.error || "Error del servidor");
      if(j.conflict){ err.conflict = true; err.version = j.version; }
      throw err;
    }
    return j;
  }
};

async function leerAlmacen(){
  if(modoAlmacen === "local"){
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  const j = await API.get("getDB");
  servidorAntiguo = (j.version === undefined);
  dbVersion = Number(j.version) || 0;
  return j.db ? JSON.parse(j.db) : null;
}

let textoLeido = null;
async function loadDB(){
  modoAlmacen = API.url() ? "nube" : "local";
  try{
    const guardada = await leerAlmacen();
    textoLeido = guardada ? JSON.stringify(guardada) : null;
    DB = guardada || defaultDB();
    nubeLista = true;
    storageOk = true;
  }catch(e){
    // No se pudo leer: se muestra una base vacía SOLO en memoria y se bloquea el guardado
    DB = defaultDB();
    nubeLista = false;
    storageOk = false;
  }
  if(!DB.pin) DB.pin = "3097";
  if(!DB.pinEscuela) DB.pinEscuela = "0009";
  migrateDB();
  // Solo se guarda al arrancar si de verdad hubo algo que completar/migrar (evita versiones y choques innecesarios)
  if(nubeLista && JSON.stringify(DB) !== textoLeido) await saveDB({ silentConflict: true });
  state.loading = false;
  render();
}

// Devuelve true si guardó, false si falló, "conflict" si otra persona guardó antes (solo con silentConflict)
async function saveDB(opts){
  opts = opts || {};
  if(!nubeLista){
    storageOk = false;
    render();
    showToast("No se guardó: sin conexión con la base de datos. Recarga la página.");
    return false;
  }
  try{
    if(modoAlmacen === "local"){
      localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    }else{
      const j = await API.post({ action: "saveDB", db: JSON.stringify(DB), baseVersion: dbVersion });
      dbVersion = Number(j.version) || dbVersion;
    }
    storageOk = true;
    revisarTamanoDB();
    return true;
  }catch(e){
    if(e.conflict){
      if(opts.silentConflict) return "conflict";
      await recargarPorConflicto();
      return false;
    }
    showToast("Error al guardar: " + String(e.message || "intenta de nuevo en unos segundos").slice(0,120));
    return false;
  }
}
async function recargarPorConflicto(){
  try{
    const nuevo = await leerAlmacen();
    if(nuevo){ DB = nuevo; migrateDB(); }
  }catch(e){}
  render();
  showConfirmModal("Otra persona actualizó la información mientras trabajabas. Se cargaron los datos más recientes y tu último cambio NO se guardó. Revisa y vuelve a hacerlo.", ()=>{}, "Entendido");
}
// Punto único para modificar la base: lee lo más reciente, aplica el cambio y guarda con candado de versión.
// Si alguien guarda en medio, reintenta sobre los datos nuevos, así no se pierde ningún registro.
let colaDB = Promise.resolve();
let escribiendo = 0;
function mutarDB(fn){
  const tarea = colaDB.then(()=>mutarDBInterno(fn));
  colaDB = tarea.catch(()=>{});
  return tarea;
}
async function mutarDBInterno(fn){
  escribiendo++;
  try{
    if(!nubeLista){ await saveDB(); return false; }
    if(modoAlmacen !== "local") showToast("Guardando…");
    for(let intento=0; intento<4; intento++){
      if(modoAlmacen !== "local"){
        try{
          const nuevo = await leerAlmacen();
          if(nuevo){ DB = nuevo; migrateDB(); }
        }catch(e){ showToast("No se pudo leer la base de datos: " + (e.message || "intenta de nuevo")); return false; }
      }
      fn(DB);
      const r = await saveDB({ silentConflict: true });
      if(r !== "conflict") return r === true;
    }
    showToast("Hubo muchos cambios simultáneos. Intenta de nuevo.");
    return false;
  }finally{ escribiendo--; }
}

/* ------------------- SINCRONIZAR ENTRE DISPOSITIVOS ------------------- */
// Cada vez que la pestaña vuelve a estar activa (se cambia de app, se
// regresa de otro dispositivo, se restaura la computadora, etc.) se
// vuelve a leer lo último guardado, para que todos vean los mismos datos.
// Se evita interrumpir si hay un formulario/modal abierto para no perder
// lo que se esté escribiendo.
let refrescando = false, ultimoRefresco = 0;
async function reintentarCarga(){
  if(modoAlmacen !== "nube" || nubeLista || cargando) return;
  cargando = true;
  try{
    const guardada = await leerAlmacen();
    textoLeido = guardada ? JSON.stringify(guardada) : null;
    DB = guardada || defaultDB();
    nubeLista = true; storageOk = true;
    migrateDB();
    if(JSON.stringify(DB) !== textoLeido) await saveDB({ silentConflict: true });
    render();
    showToast("Conexión recuperada.");
  }catch(e){ /* se vuelve a intentar al volver a la pestaña */ }
  finally{ cargando = false; }
}
let cargando = false;
async function refrescarDesdeNube(){
  if(modoAlmacen === "nube" && !nubeLista && DB && !state.loading){ reintentarCarga(); return; }
  if(!DB || state.loading || !state.accesoOk || !nubeLista) return;
  if(refrescando || escribiendo > 0 || Date.now() - ultimoRefresco < 4000) return; // evita ráfagas (focus + visibilitychange + pageshow)
  refrescando = true; ultimoRefresco = Date.now();
  try{ await refrescarInterno(); } finally{ refrescando = false; }
}
async function refrescarInterno(){
  if(document.querySelector(".modal-bg")) return;
  const activo = document.activeElement;
  if(activo && (activo.tagName==="INPUT" || activo.tagName==="TEXTAREA" || activo.tagName==="SELECT")) return;
  try{
    const nuevo = await leerAlmacen();
    if(nuevo && escribiendo === 0){
      DB = nuevo;
      storageOk = true;
      migrateDB();
      render();
    }
  }catch(e){ /* si falla, se conserva lo que ya está en pantalla */ }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refrescarDesdeNube(); });
window.addEventListener("focus", refrescarDesdeNube);
window.addEventListener("pageshow", refrescarDesdeNube);

  if(!DB.pinDireccion) DB.pinDireccion = "7200";

}

function validarGasto(d){
  if(!String(d.concepto||"").trim()) return "Escribe el concepto del pedido.";
  if(!(Number(d.costo) > 0)) return "El costo debe ser mayor a $0.";
  if(d.cantidad !== "" && d.cantidad != null && Number(d.cantidad) < 0) return "La cantidad no puede ser negativa.";
  if(d.fechaPedido && d.fechaEntrega && d.fechaEntrega < d.fechaPedido) return "La fecha de entrega no puede ser anterior a la del pedido.";
  if(d.salon !== undefined && !SALONES.includes(d.salon)) return "Elige un salón válido.";
  if(d.mes !== undefined && !MESES.includes(d.mes)) return "Elige un mes válido.";

let registrandoGasto = false, intentoPrevio = null;
async function registrarGasto(items, meta){
  if(registrandoGasto){ showToast("Guardando, espera un momento…"); return false; }
  registrandoGasto = true;
  try{ return await registrarGastoInterno(items, meta); } finally{ registrandoGasto = false; }
}
async function registrarGastoInterno(items, meta){
  meta = meta || {};
  // Si un intento anterior idéntico falló (p. ej. se perdió la respuesta aunque el servidor sí guardó),
  // se reutilizan los mismos id: así el reintento no duplica la compra.
  const firma = JSON.stringify([items, meta.tienda || ""]) + "|" + state.role;
  const reusar = intentoPrevio && intentoPrevio.firma === firma && Date.now() - intentoPrevio.ts < 300000;
  const ticketId = reusar ? intentoPrevio.ticketId : ((items.length > 1 || meta.tienda) ? "t" + uid() : "");
  const ids = reusar ? intentoPrevio.ids : items.map(()=>uid());
  intentoPrevio = { firma, ids, ticketId, ts: Date.now() };
  const ahora = new Date().toISOString();
  const nuevos = items.map((d, i)=>{
    const g = { id: ids[i], salon: d.salon, mes: d.mes, concepto: String(d.concepto).trim(), cantidad: d.cantidad, costo: Number(d.costo),
      fechaPedido: d.fechaPedido, fechaEntrega: d.fechaEntrega, avisoAnticipado: !!d.avisoAnticipado,
      observacion: i === 0 ? (d.observacion || "") : "", // la observación del ticket se guarda una sola vez
      registradoEn: ahora, registradoPor: state.nombreOp || "Operaciones", registradoRol: state.role };
    if(ticketId){ g.ticketId = ticketId; g.tienda = meta.tienda || ""; }
    return g;
  });
  const ok = await mutarDB(db=>{
    const ya = new Set(db.gastos.map(x=>x.id));
    nuevos.forEach(x=>{ if(!ya.has(x.id)) db.gastos.push(x); }); // idempotente ante reintentos
  });
  if(!ok) return false;
  intentoPrevio = null;
  enviarFilasASheets("Gastos", ENCAB_GASTOS, nuevos.map(filaGasto));
  return true;
}
function totalFondosRecibidos(){
  return DB.fondos.reduce((a,f)=>a+Number(f.monto||0),0);
}
function totalGastoGeneral(){
  return SALONES.reduce((a,s)=>a+totalGastadoCiclo(s),0);
}
function saldoDisponible(){
  return totalFondosRecibidos() - totalGastoGeneral();
}

function gastosDeSalon(salon){ return DB.gastos.filter(g=>g.salon===salon); }
function gastosDeSalonMes(salon, mes){ return gastosDeSalon(salon).filter(g=>g.mes===mes); }
function totalGastado(salon, mes){
  return gastosDeSalonMes(salon, mes).reduce((a,g)=>a+Number(g.costo||0),0);
}
function totalGastadoCiclo(salon){
  return gastosDeSalon(salon).reduce((a,g)=>a+Number(g.costo||0),0);
}
function presupuestoMes(salon, mes){ return Number(DB.presupuestos[salon]?.[mes] || 0); }
function presupuestoCiclo(salon){
  return MESES.reduce((a,m)=>a+presupuestoMes(salon,m),0);
}
function infoMensualSalon(salon){
  let arrastre = 0;
  const info = {};
  MESES.forEach(mes=>{
    const base = presupuestoMes(salon, mes);
    const disponible = base + arrastre;
    const gastado = totalGastado(salon, mes);
    const restante = disponible - gastado;
    info[mes] = { base, arrastre, disponible, gastado, restante };
    arrastre = restante;
  });
  return info;
}

function render(){
  const root = document.getElementById("app");
  if(state.loading){
    root.innerHTML = `<div class="center-screen small-muted">Cargando caja chica…</div>`;
    return;
  }
  if(!state.accesoOk){
    root.innerHTML = renderAcceso();
    bindAcceso();
    return;
  }
  if(!state.role){
    root.innerHTML = renderRoleChoice();
    bindRoleChoice();
    return;
  }
  root.innerHTML = renderTopbar() + ((state.role==="operaciones"||state.role==="direccion") ? renderOperaciones() : renderTutor());
  bindGlobal();
  if(state.role==="operaciones"||state.role==="direccion") bindOperaciones();
  else bindTutor();
}

  return `

    <div class="card" style="max-width:360px;width:100%;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;">

      </div>

      </div>

      <p class="small-muted" style="font-size:11.5px;margin:0 0 12px;">El PIN es solo un filtro de acceso, no una contraseña segura.</p>

function bindAcceso(){
  const input = document.getElementById("ac-pin");
  input.focus();
  const tryEnter = ()=>{
    const pinValido = DB.pinEscuela || "0009";

  };
  document.getElementById("ac-entrar").onclick = tryEnter;

        <button class="btn btn-primary" id="pin-ok" style="flex:1;">Entrar</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);

/* ---------------------------- OPERACIONES ---------------------------- */
function renderOperaciones(){
  const soloLectura = esSoloLectura();
  let tabs = [["resumen","Resumen del ciclo"],["registrar","Registrar compra"],["presupuestos","Presupuestos"],["fondos","Fondos recibidos"],["gastos","Todos los gastos"],["reportes","Reportes"],["observaciones","Observaciones"],["historial","Historial de ciclos"],["ajustes","Ajustes"]];
  if(soloLectura) tabs = tabs.filter(([k])=> k!=="ajustes");
  if(soloLectura && state.tab==="ajustes") state.tab = "resumen";
  const notasCount = contarNotasNuevas(null);
  return `
  <div class="tabs">
    ${tabs.map(([k,l])=>`<div class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}${k==="observaciones" && notasCount ? `<span class="badge-count">${notasCount}</span>`:""}</div>`).join("")}
  </div>
  <div id="op-content">${renderOpTab()}</div>
  `;
}
function renderOpTab(){
  if(state.tab==="resumen") return renderOpResumen();
  if(state.tab==="registrar") return renderOpRegistrar();
  if(state.tab==="presupuestos") return renderOpPresupuestos();
  if(state.tab==="fondos") return renderOpFondos();
  if(state.tab==="gastos") return renderOpGastos();
  if(state.tab==="reportes") return renderOpReportes();
  if(state.tab==="observaciones") return renderOpObservaciones();
  if(state.tab==="historial") return renderPromedioSalones() + renderOpHistorial();
  if(state.tab==="ajustes") return renderOpAjustes();
  return "";
}
function bindOperaciones(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ state.tab = t.dataset.tab; document.getElementById("op-content").innerHTML = renderOpTab(); bindOpTabEvents(); };
  });
  bindOpTabEvents();
}
function bindOpTabEvents(){
  if(state.tab==="resumen") bindOpResumen();
  if(state.tab==="registrar") bindOpRegistrar();
  if(state.tab==="presupuestos") bindOpPresupuestos();
  if(state.tab==="fondos") bindOpFondos();
  if(state.tab==="gastos") bindOpGastos();
  if(state.tab==="ajustes") bindOpAjustes();
  if(state.tab==="reportes") bindOpReportes();
  if(state.tab==="historial") bindOpHistorial();
  if(state.tab==="observaciones") bindOpObservaciones();
}

function renderOpResumen(){
  const totalPresupuesto = SALONES.reduce((a,s)=>a+presupuestoCiclo(s),0);
  const totalGasto = SALONES.reduce((a,s)=>a+totalGastadoCiclo(s),0);
  const restante = totalPresupuesto - totalGasto;
  const pctUsado = totalPresupuesto>0 ? Math.round((totalGasto/totalPresupuesto)*100) : 0;
  const barras = SALONES.map(s=>{
    const p = presupuestoCiclo(s), g = totalGastadoCiclo(s);
    const pct = p>0 ? Math.min(100,(g/p)*100) : (g>0?100:0);
    const nivel = nivelAlerta(g, p);
    return `<div class="bar-row">
      <div class="bar-label">${s}</div>
      <div class="bar-track"><div class="bar-fill ${nivel==='sobregasto'?'over':nivel==='atencion'?'atencion':''}" style="width:${pct}%"></div></div>
      <div class="bar-amt">${fmtMoney(g)} / ${fmtMoney(p)} ${tagAlerta(g,p)}</div>
    </div>`;
  }).join("");
  return `
  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card"><p class="metric-label">Presupuesto del ciclo</p><p class="metric-value">${fmtMoney(totalPresupuesto)}</p></div>
    <div class="card"><p class="metric-label">Gastado en el ciclo</p><p class="metric-value">${fmtMoney(totalGasto)}</p></div>
    <div class="card"><p class="metric-label">Restante</p><p class="metric-value" style="color:${restante<0?'#A6453D':'#16281F'}">${fmtMoney(restante)}</p></div>
    <div class="card"><p class="metric-label">% usado</p><p class="metric-value">${pctUsado}%</p></div>
  </div>
  <div class="grid grid-2" style="margin-bottom:26px;">
    <div class="card"><p class="metric-label">Fondos recibidos de Dirección</p><p class="metric-value">${fmtMoney(totalFondosRecibidos())}</p><p class="metric-sub">Respaldo acumulado en el ciclo</p></div>
    <div class="card"><p class="metric-label">Saldo disponible ahora</p><p class="metric-value" style="color:${saldoDisponible()<0?'#A6453D':'#16281F'}">${fmtMoney(saldoDisponible())}</p><p class="metric-sub">Fondos recibidos menos gasto general</p></div>
  </div>
  <div class="card" style="margin-bottom:22px;">
    <p class="section-title"><span class="dot"></span>Gasto vs. presupuesto por salón (ciclo completo)</p>
    ${barras}
  </div>
  <div class="flex-between" style="margin-bottom:14px;">
    <p class="section-title" style="margin:0;"><span class="dot"></span>Detalle por mes y salón</p>
    <button class="btn btn-secondary" id="btn-exportar">Exportar CSV</button>
  </div>
  <div class="card" style="overflow-x:auto;">
    <table>
      <tr><th>Salón</th>${MESES.map(m=>`<th>${m.slice(0,3)}</th>`).join("")}<th>Total</th></tr>
      ${SALONES.map(s=>`<tr><td>${s}</td>${MESES.map(m=>`<td>${totalGastado(s,m)>0?fmtMoney(totalGastado(s,m)):'—'}</td>`).join("")}<td style="font-weight:600;">${fmtMoney(totalGastadoCiclo(s))}</td></tr>`).join("")}
    </table>
  </div>`;
}
function bindOpResumen(){
  const btn = document.getElementById("btn-exportar");
  if(btn) btn.onclick = exportarCSV;
}
function exportarCSV(){
  let rows = [["Salón","Mes","Concepto","Cantidad","Costo","Fecha pedido","Fecha entrega","Avisó con anticipación","Observación","Registró"]];
  DB.gastos.forEach(g=>{
    rows.push([g.salon,g.mes,g.concepto,g.cantidad,g.costo,g.fechaPedido||"",g.fechaEntrega||"",g.avisoAnticipado?"Sí":"No",g.observacion||"",g.registradoPor||""]);
  });
  const csvSeguro = (c)=>{ const t = String(c); return (typeof c === "string" && /^[=+\-@\t\r]/.test(t)) ? "'" + t : t; };
  const csv = rows.map(r=>r.map(c=>`"${csvSeguro(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `caja_chica_${DB.ciclo}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function comprimirImagen(file, maxPx, calidad){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", calidad).split(",")[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("No se pudo abrir la imagen")); };
    img.src = url;
  });
}
function bindOpRegistrar(){
  const tbody = document.getElementById("rg-tbody");
  const recalcular = ()=>{
    const total = [...tbody.querySelectorAll(".it-costo")].reduce((a,i)=>a+(Number(i.value)||0),0);
    document.getElementById("rg-total").textContent = fmtMoney(total);
  };
  const agregar = (it)=>{ tbody.insertAdjacentHTML("beforeend", filaInsumoHTML(it)); recalcular(); };
  for(let i=0;i<3;i++) agregar();
  tbody.addEventListener("input", recalcular);
  tbody.addEventListener("click", (e)=>{
    if(!e.target.classList.contains("it-del")) return;
    if(tbody.children.length > 1) e.target.closest("tr").remove(); else e.target.closest("tr").querySelectorAll("input").forEach(i=>i.value="");
    recalcular();
  });
  tbody.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter" || !e.target.classList.contains("it-costo")) return;
    e.preventDefault();
    const filas = tbody.querySelectorAll("tr");
    if(e.target.closest("tr") === filas[filas.length-1]) agregar();
    tbody.lastElementChild.querySelector(".it-concepto").focus();
  });
  document.getElementById("rg-add").onclick = ()=>{ agregar(); tbody.lastElementChild.querySelector(".it-concepto").focus(); };

  // --- Escaneo de ticket: la foto se lee en Apps Script y solo LLENA la lista; nada se guarda sin tu confirmación
  const inputFoto = document.getElementById("rg-foto");
  const estado = document.getElementById("rg-foto-estado");
  document.getElementById("rg-foto-btn").onclick = ()=>{
    if(!API.url()){ showToast("Escanear tickets requiere la conexión con Apps Script."); return; }
    inputFoto.click();
  };
  inputFoto.onchange = async ()=>{
    const file = inputFoto.files[0];
    if(!file) return;
    estado.textContent = "Leyendo ticket…";
    try{
      const b64 = await comprimirImagen(file, 1600, 0.82);
      const j = await API.post({ action: "parseTicket", image: b64, mediaType: "image/jpeg" });
      const t = j.ticket;
      if(t.tienda) document.getElementById("rg-tienda").value = t.tienda;
      if(t.fecha){
        if(!document.getElementById("rg-fpedido").value) document.getElementById("rg-fpedido").value = t.fecha;
        if(!document.getElementById("rg-fentrega").value) document.getElementById("rg-fentrega").value = t.fecha;
        const mes = mesDeFecha(t.fecha);
        if(mes) document.getElementById("rg-mes").value = mes;
      }
      tbody.innerHTML = "";
      t.items.forEach(it=>agregar(it));
      const suma = t.items.reduce((a,it)=>a+Number(it.costo||0),0);
      const difiere = t.total && Math.abs(suma - t.total) > 0.5;
      estado.textContent = `Se leyeron ${t.items.length} insumos por ${fmtMoney(suma)}.` + (difiere ? ` ⚠️ El ticket indica ${fmtMoney(t.total)}; revisa los renglones.` : " Revisa y corrige antes de registrar.");
    }catch(err){
      estado.textContent = "";
      showToast("No se pudo leer el ticket: " + (err.message || "intenta con otra foto") + ". Puedes capturarlo a mano.");
    }
    inputFoto.value = "";
  };

  document.getElementById("rg-submit").onclick = ()=>{
    if(document.querySelector(".modal-bg")) return; // ya hay una confirmación abierta
    const salonBase = document.getElementById("rg-salon").value;
    const mes = document.getElementById("rg-mes").value;
    const tienda = document.getElementById("rg-tienda").value.trim();
    const fechaPedido = document.getElementById("rg-fpedido").value;
    const fechaEntrega = document.getElementById("rg-fentrega").value;
    const avisoAnticipado = document.getElementById("rg-aviso").checked;
    const observacion = document.getElementById("rg-obs").value.trim();
    const items = [];
    for(const fila of tbody.querySelectorAll("tr")){
      const concepto = fila.querySelector(".it-concepto").value.trim();
      const cantidad = fila.querySelector(".it-cantidad").value;
      const costoTxt = fila.querySelector(".it-costo").value;
      if(!concepto && !costoTxt) continue; // renglón vacío
      items.push({ salon: fila.querySelector(".it-salon").value || salonBase, mes, concepto, cantidad, costo: Number(costoTxt), fechaPedido, fechaEntrega, avisoAnticipado, observacion });
    }
    if(items.length === 0){ showToast("Agrega al menos un insumo con su costo."); return; }
    for(let i=0;i<items.length;i++){
      const err = validarGasto(items[i]);
      if(err){ showToast(items.length > 1 ? `Renglón ${i+1}: ${err}` : err); return; }
    }
    const total = items.reduce((a,it)=>a+it.costo,0);
    const porSalon = {};
    items.forEach(it=>{ porSalon[it.salon] = (porSalon[it.salon]||0) + it.costo; });
    let avisoExtra = "";
    Object.keys(porSalon).forEach(salon=>{
      const infoAntes = infoMensualSalon(salon)[mes];
      const gastadoDespues = infoAntes.gastado + porSalon[salon];
      const nivel = nivelAlerta(gastadoDespues, infoAntes.disponible);
      if(nivel === "sobregasto") avisoExtra += `<p style="color:var(--brick-700);font-weight:600;margin-top:10px;">⚠️ Con esta compra, ${salon} se pasa del presupuesto disponible de ${mes}.</p>`;
      else if(nivel === "atencion") avisoExtra += `<p style="color:var(--gold-700);font-weight:600;margin-top:10px;">⚠️ Con esta compra, ${salon} llega al ${Math.round((gastadoDespues/infoAntes.disponible)*100)}% de su presupuesto de ${mes}.</p>`;
    });
    showConfirmModal(`
      <div style="text-align:left;">
        <p style="margin:0 0 10px;"><strong>Confirma el registro:</strong></p>
        <p style="margin:2px 0;">${escAttr(tienda || "Compra")} · ${mes}</p>
        ${items.map(it=>`<p style="margin:2px 0;">${escAttr(it.salon)} — ${escAttr(it.concepto)}${it.cantidad?` (${escAttr(it.cantidad)})`:""}: ${fmtMoney(it.costo)}</p>`).join("")}
        <p style="margin:8px 0 2px;font-weight:600;">Total: ${fmtMoney(total)}</p>
        ${avisoExtra}
      </div>`, async ()=>{
      const ok = await registrarGasto(items, { tienda });
      if(!ok) return;
      showToast(items.length > 1 ? `Compra registrada (${items.length} insumos).` : "Compra registrada.");
      document.getElementById("op-content").innerHTML = renderOpRegistrar();
      bindOpRegistrar();
    }, "Sí, registrar");
  };
}

    <p class="small-muted" style="margin-top:0;">Toda la información (compras, fondos, presupuestos y ajustes) se guarda en tu Hoja de Google mediante una Aplicación Web vinculada, y cada compra y fondo además queda registrado en las pestañas "Gastos" y "Fondos".</p>
    <details style="margin-bottom:16px;">
      <summary style="cursor:pointer;font-weight:600;font-size:13px;color:var(--forest-700);">Ver los pasos para activarlo</summary>
      <ol style="font-size:13px;color:var(--ink-700);line-height:1.7;padding-left:18px;margin-top:10px;">
        <li>Abre o crea una Hoja de Google. Ve a <strong>Extensiones → Apps Script</strong>.</li>
        <li>Borra el código anterior y pega el siguiente script:
          <pre style="background:var(--sage-50);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;overflow-x:auto;white-space:pre-wrap;">/**
 * Caja Chica — Backend en Google Apps Script
 *
 * Endpoints (Web App, ruta /exec):
 *   GET  ?action=ping                 -&gt; {ok:true}
 *   GET  ?action=getDB                -&gt; {ok:true, db:"&lt;json&gt;"|null, updatedAt, version}
 *   POST {action:"saveDB", db:"&lt;json&gt;", baseVersion:N}       -&gt; {ok:true, updatedAt, version}
 *        Si baseVersion no coincide con la versión guardada -&gt; {ok:false, conflict:true, version}
 *        (candado contra choques: nadie sobrescribe cambios que no ha visto)
 *   POST {action:"append", tipo, encabezados:[], fila:[]}    -&gt; {ok:true}
 *   POST {action:"appendMany", tipo, encabezados:[], filas:[[]]} -&gt; {ok:true}
 *   POST {action:"parseTicket", image:"&lt;base64 jpeg&gt;", mediaType} -&gt; {ok:true, ticket:{tienda,fecha,items:[],total}}
 *        Requiere la propiedad de script ANTHROPIC_API_KEY (opcional MODELO_TICKET).
 *
 * Seguridad opcional: define la propiedad de script API_TOKEN (Configuración del proyecto
 * -&gt; Propiedades de la secuencia de comandos). Si existe, cada petición debe incluir el mismo token.
 *
 * CORS: Apps Script no permite personalizar encabezados de respuesta. Las Web Apps publicadas
 * como "Cualquier usuario" ya responden con Access-Control-Allow-Origin: * en la redirección
 * de googleusercontent.com, siempre que el cliente use peticiones simples (GET, o POST con
 * Content-Type text/plain, sin preflight). Eso es lo que hace app.js.
 */

var HOJA_DB = '_DB';
var HOJA_PREV = '_DB_anterior';   // copia de seguridad: la versión previa al último guardado
var HOJA_DIA = '_DB_del_dia';     // copia de seguridad: estado al primer guardado de cada día
var HOJAS_BITACORA = ['Gastos', 'Fondos', 'Prueba']; // únicas pestañas que el cliente puede crear/escribir
var TAM_BLOQUE = 40000; // una celda admite máx. 50,000 caracteres
var MARCA = 'J';        // prefijo de cada bloque: evita que Sheets lo interprete como fórmula, número o fecha
var MAX_TICKETS_DIA = 60; // tope diario de lecturas de ticket (protege tu saldo de la API)
var VERSION_SCRIPT = 4;

function doGet(e) {
  try {
    var p = (e &amp;&amp; e.parameter) || {};
    verificarToken_(p.token);
    switch (p.action) {
      case 'ping':
        return json_({ ok: true, pong: new Date().toISOString(), scriptVersion: VERSION_SCRIPT });
      case 'getDB':
        return json_(leerDBConCandado_());
      default:
        return json_({ ok: false, error: 'Acción GET no válida' });
    }
  } catch (err) {
    return json_({ ok: false, error: String(err.message || err) });
  }
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  var tieneLock = false;
  try {
    var body = JSON.parse((e &amp;&amp; e.postData &amp;&amp; e.postData.contents) || '{}');
    verificarToken_(body.token);

    // La lectura de tickets es lenta y no toca la hoja: no debe retener el candado
    if (body.action === 'parseTicket') {
      return json_({ ok: true, ticket: leerTicket_(body.image, body.mediaType) });
    }

    lock.waitLock(20000);
    tieneLock = true;
    switch (body.action) {
      case 'saveDB':
        return json_(guardarDB_(body.db, body.baseVersion));
      case 'append':
        return json_(agregarFila_(body.tipo, body.encabezados, body.fila));
      case 'appendMany':
        return json_(agregarFilas_(body.tipo, body.encabezados, body.filas));
      default:
        return json_({ ok: false, error: 'Acción POST no válida' });
    }
  } catch (err) {
    return json_({ ok: false, error: String(err.message || err) });
  } finally {
    if (tieneLock) { try { lock.releaseLock(); } catch (x) {} }
  }
}

/* ---------------------------- Base de datos (JSON en bloques) ---------------------------- */

function libro_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) {
    var id = PropertiesService.getScriptProperties().getProperty('SHEET_ID');
    if (id) ss = SpreadsheetApp.openById(id);
  }
  if (!ss) throw new Error('El script no está vinculado a una Hoja de Google. Créalo desde Extensiones &gt; Apps Script dentro de la hoja, o define la propiedad SHEET_ID.');
  return ss;
}

function hojaDB_() {
  var ss = libro_();
  var hoja = ss.getSheetByName(HOJA_DB);
  if (!hoja) {
    hoja = ss.insertSheet(HOJA_DB);
    hoja.getRange(1, 1, 1, 2).setValues([['bloque', 'json']]);
  }
  return hoja;
}

function versionActual_() {
  return Number(PropertiesService.getScriptProperties().getProperty('DB_VERSION')) || 0;
}

function guardarDB_(dbString, baseVersion) {
  if (typeof dbString !== 'string' || !dbString) throw new Error('Falta el campo db');
  var parsed = JSON.parse(dbString); // valida que sea JSON antes de reemplazar lo existente
  if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.gastos) || !Array.isArray(parsed.fondos)) {
    throw new Error('La base de datos no tiene el formato esperado');
  }

  // Candado optimista: si alguien guardó después de que este cliente leyó, se rechaza.
  // baseVersion es obligatorio: ninguna escritura "a ciegas".
  var actual = versionActual_();
  if (baseVersion === undefined || baseVersion === null) throw new Error('Falta baseVersion (actualiza la página)');
  if (Number(baseVersion) !== actual) {
    return { ok: false, conflict: true, version: actual, error: 'Conflicto de versión' };
  }

  // Respaldos antes de tocar nada
  respaldar_();

  var bloques = partir_(dbString);
  var hoja = hojaDB_();
  var previas = hoja.getLastRow() - 1;

  // 1) escribir lo nuevo, 2) solo entonces limpiar lo que sobre: si algo falla a medias, nunca se pierde todo
  var rango = hoja.getRange(2, 2, bloques.length, 1);
  rango.setNumberFormat('@');
  rango.setValues(bloques.map(function (b) { return [MARCA + b]; }));
  hoja.getRange(2, 1, bloques.length, 1).setValues(bloques.map(function (_, idx) { return [idx + 1]; }));
  if (previas &gt; bloques.length) hoja.getRange(bloques.length + 2, 1, previas - bloques.length, 2).clearContent();

  var ahora = new Date().toISOString();
  var nueva = actual + 1;
  PropertiesService.getScriptProperties().setProperties({ DB_UPDATED_AT: ahora, DB_VERSION: String(nueva) });
  return { ok: true, updatedAt: ahora, bloques: bloques.length, version: nueva };
}

// Parte el texto en bloques sin separar un par sustituto (emoji): Sheets corrompería la mitad suelta
function partir_(texto) {
  var out = [];
  var i = 0;
  while (i &lt; texto.length) {
    var fin = Math.min(i + TAM_BLOQUE, texto.length);
    if (fin &lt; texto.length) {
      var c = texto.charCodeAt(fin - 1);
      if (c &gt;= 0xD800 &amp;&amp; c &lt;= 0xDBFF) fin--;
    }
    out.push(texto.substring(i, fin));
    i = fin;
  }
  return out;
}

function copiarHoja_(origenNombre, destinoNombre) {
  var ss = libro_();
  var o = ss.getSheetByName(origenNombre);
  if (!o || o.getLastRow() &lt; 2) return false;
  var d = ss.getSheetByName(destinoNombre) || ss.insertSheet(destinoNombre);
  var n = o.getLastRow() - 1;
  var vals = o.getRange(2, 1, n, 2).getValues();
  var prev = d.getLastRow() - 1;
  var r = d.getRange(2, 2, n, 1);
  r.setNumberFormat('@');
  d.getRange(2, 1, n, 2).setValues(vals);
  if (prev &gt; n) d.getRange(n + 2, 1, prev - n, 2).clearContent();
  return true;
}

function respaldar_() {
  try {
    var props = PropertiesService.getScriptProperties();
    var hoy = new Date().toISOString().substring(0, 10);
    copiarHoja_(HOJA_DB, HOJA_PREV);
    if (props.getProperty('DB_DIA') !== hoy &amp;&amp; copiarHoja_(HOJA_DB, HOJA_DIA)) {
      props.setProperty('DB_DIA', hoy); // solo se marca el día si de verdad se copió algo
    }
  } catch (e) { /* un fallo del respaldo no debe impedir guardar */ }
}

function leerDBConCandado_() {
  var lock = LockService.getScriptLock();
  lock.waitLock(15000); // evita leer a mitad de una escritura
  try { return leerDB_(); } finally { try { lock.releaseLock(); } catch (x) {} }
}

function leerDB_() {
  var hoja = hojaDB_();
  var ultima = hoja.getLastRow();
  var updatedAt = PropertiesService.getScriptProperties().getProperty('DB_UPDATED_AT') || null;
  var version = versionActual_();
  if (ultima &lt; 2) return { ok: true, db: null, updatedAt: updatedAt, version: version };

  var valores = hoja.getRange(2, 2, ultima - 1, 1).getValues();
  var texto = valores.map(function (f) { var v = String(f[0]); return v.charAt(0) === MARCA ? v.substring(1) : v; }).join('');
  return { ok: true, db: texto || null, updatedAt: updatedAt, version: version };
}

/* ---------------------------- Bitácora (Gastos, Fondos, Prueba…) ---------------------------- */

function textoSeguro_(v) {
  // Evita inyección de fórmulas: un texto que empieza con = + - @ se guarda como texto
  if (typeof v === 'string' &amp;&amp; /^[=+\\-@]/.test(v)) return "'" + v;
  return v;
}

function hojaBitacora_(tipo, encabezados) {
  if (HOJAS_BITACORA.indexOf(tipo) &lt; 0) throw new Error('Pestaña no permitida');
  var ss = libro_();
  var hoja = ss.getSheetByName(tipo) || ss.insertSheet(tipo);
  if (hoja.getLastRow() === 0 &amp;&amp; Array.isArray(encabezados)) {
    hoja.appendRow(encabezados.map(textoSeguro_));
  } else if (Array.isArray(encabezados)) {
    // hoja existente con menos columnas (versión anterior): se completan solo los encabezados que faltan
    var cols = hoja.getLastColumn();
    if (cols &gt; 0 &amp;&amp; cols &lt; encabezados.length) {
      hoja.getRange(1, cols + 1, 1, encabezados.length - cols).setValues([encabezados.slice(cols).map(textoSeguro_)]);
    }
  }
  return hoja;
}

function agregarFila_(tipo, encabezados, fila) {
  if (!Array.isArray(fila)) throw new Error('El campo fila debe ser un arreglo');
  var hoja = hojaBitacora_(tipo, encabezados);
  hoja.appendRow(fila.map(textoSeguro_));
  return { ok: true };
}

function agregarFilas_(tipo, encabezados, filas) {
  if (!Array.isArray(filas) || !filas.length) throw new Error('El campo filas debe ser un arreglo con datos');
  var hoja = hojaBitacora_(tipo, encabezados);
  var ancho = filas.reduce(function (m, f) { return Math.max(m, Array.isArray(f) ? f.length : 0); }, 0);
  var datos = filas.map(function (f) {
    var fila = (Array.isArray(f) ? f : []).map(textoSeguro_);
    while (fila.length &lt; ancho) fila.push('');
    return fila;
  });
  var inicio = hoja.getLastRow() + 1;
  hoja.getRange(inicio, 1, datos.length, ancho).setValues(datos);
  return { ok: true, filas: datos.length };
}

/* ---------------------------- Lectura de tickets (foto -&gt; insumos) ---------------------------- */

function contarTicket_() {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var props = PropertiesService.getScriptProperties();
    var hoy = new Date().toISOString().substring(0, 10);
    var tope = Number(props.getProperty('MAX_TICKETS_DIA')) || MAX_TICKETS_DIA;
    var usados = props.getProperty('TICKETS_FECHA') === hoy ? Number(props.getProperty('TICKETS_N')) || 0 : 0;
    if (usados &gt;= tope) throw new Error('Se alcanzó el límite diario de lecturas de ticket (' + tope + '). Captura a mano o inténtalo mañana.');
    props.setProperties({ TICKETS_FECHA: hoy, TICKETS_N: String(usados + 1) });
  } finally { try { lock.releaseLock(); } catch (x) {} }
}

function llamarModelo_(key, modelo, imagenB64, mediaType, prompt) {
  return UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {
    method: 'post',
    contentType: 'application/json',
    muteHttpExceptions: true,
    headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01' },
    payload: JSON.stringify({
      model: modelo,
      max_tokens: 2000,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: mediaType || 'image/jpeg', data: imagenB64 } },
        { type: 'text', text: prompt }
      ] }]
    })
  });
}

function leerTicket_(imagenB64, mediaType) {
  var props = PropertiesService.getScriptProperties();
  var key = props.getProperty('ANTHROPIC_API_KEY');
  if (!key) throw new Error('Falta la propiedad ANTHROPIC_API_KEY en Apps Script (Configuración del proyecto).');
  if (!imagenB64 || typeof imagenB64 !== 'string' || imagenB64.length &gt; 6000000) throw new Error('Imagen vacía o demasiado grande');

  var prompt = 'Lee este ticket o nota de compra y responde SOLO con JSON válido, sin texto adicional ni comillas invertidas, ' +
    'con esta forma: {"tienda":"nombre del establecimiento o vacío","fecha":"AAAA-MM-DD o vacío",' +
    '"items":[{"concepto":"descripción corta del producto","cantidad":número o null,"costo":importe TOTAL de ese renglón en pesos}],' +
    '"total":total impreso en el ticket o null}. El costo es el importe del renglón (cantidad x precio unitario), no el precio unitario. ' +
    'No inventes renglones; omite subtotales, IVA, propinas y formas de pago.';
  contarTicket_();
  var modelo = props.getProperty('MODELO_TICKET') || 'claude-sonnet-5-5';
  var resp = llamarModelo_(key, modelo, imagenB64, mediaType, prompt);
  if (resp.getResponseCode() === 404 &amp;&amp; !props.getProperty('MODELO_TICKET')) {
    resp = llamarModelo_(key, 'claude-sonnet-4-6', imagenB64, mediaType, prompt); // respaldo si el modelo principal no existe en tu cuenta
  }
  if (resp.getResponseCode() !== 200) {
    var detalle = '';
    try { detalle = JSON.parse(resp.getContentText()).error.message; } catch (x) {}
    throw new Error('La lectura de tickets falló (' + resp.getResponseCode() + ')' + (detalle ? ': ' + String(detalle).substring(0, 160) : ''));
  }
  var salida = JSON.parse(resp.getContentText());
  var texto = String((salida.content &amp;&amp; salida.content[0] &amp;&amp; salida.content[0].text) || '').replace(/\\x60\\x60\\x60json|\\x60\\x60\\x60/g, '').trim();
  var t;
  try {
    var ini = texto.indexOf('{'), fin = texto.lastIndexOf('}');
    t = JSON.parse(ini &gt;= 0 &amp;&amp; fin &gt; ini ? texto.substring(ini, fin + 1) : texto);
  } catch (x) { throw new Error('No se pudo interpretar la respuesta de lectura. Intenta con una foto más clara.'); }
  if (!t || typeof t !== 'object') throw new Error('No se pudo interpretar la respuesta de lectura. Intenta con una foto más clara.');
  var items = (Array.isArray(t.items) ? t.items : []).map(function (it) {
    var costo = Number(it.costo);
    var cant = it.cantidad === null || it.cantidad === undefined || it.cantidad === '' ? '' : Number(it.cantidad);
    return { concepto: String(it.concepto || '').replace(/[&lt;&gt;]/g, '').substring(0, 120), cantidad: isNaN(cant) ? '' : cant, costo: isNaN(costo) ? 0 : costo };
  }).filter(function (it) { return it.concepto &amp;&amp; it.costo &gt; 0; });
  if (!items.length) throw new Error('No se pudieron leer insumos en la imagen');
  return {
    tienda: String(t.tienda || '').replace(/[&lt;&gt;]/g, '').substring(0, 80),
    fecha: /^\\d{4}-\\d{2}-\\d{2}$/.test(String(t.fecha || '')) ? t.fecha : '',
    items: items,
    total: Number(t.total) &gt; 0 ? Number(t.total) : null
  };
}

/* ---------------------------- Autorización ---------------------------- */

// Ejecútala UNA vez desde el editor (botón Ejecutar) después de pegar esta versión: Google pedirá
// los permisos nuevos (hojas, propiedades, llamadas externas). Sin esto, la Web App puede fallar
// con un error de autorización hasta que se acepten.
function autorizar() {
  libro_();
  PropertiesService.getScriptProperties().getKeys();
  LockService.getScriptLock();
  UrlFetchApp.fetch('https://api.anthropic.com/', { muteHttpExceptions: true });
  return 'Permisos autorizados';
}

/* ---------------------------- Utilidades ---------------------------- */

function verificarToken_(token) {
  var esperado = PropertiesService.getScriptProperties().getProperty('API_TOKEN');
  if (esperado &amp;&amp; token !== esperado) throw new Error('Token inválido');
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

    <button class="btn btn-secondary" id="aj-sheets-probar" style="margin-left:10px;">Enviar registro de prueba</button>

function bindOpAjustes(){
  document.getElementById("aj-ciclo-guardar").onclick = async ()=>{
    const val = document.getElementById("aj-ciclo").value.trim();
    if(!val){ showToast("Escribe un nombre de ciclo válido."); return; }
    DB.ciclo = val;
    await saveDB();
    showToast("Ciclo actualizado.");
    render();
  };
  document.getElementById("aj-pin-guardar").onclick = async ()=>{
    const nuevoPin = document.getElementById("aj-pin-op").value.trim();
    if(nuevoPin.length < 4){ showToast("El PIN debe tener al menos 4 caracteres/dígitos."); return; }
    DB.pin = nuevoPin;
    await saveDB();
    showToast("¡PIN de operaciones actualizado con éxito!");
  };
  document.getElementById("aj-pin-escuela-guardar").onclick = async ()=>{
    const nuevoPinEscuela = document.getElementById("aj-pin-escuela").value.trim();
    if(nuevoPinEscuela.length < 4){ showToast("El código debe tener al menos 4 caracteres/dígitos."); return; }
    DB.pinEscuela = nuevoPinEscuela;
    await saveDB();
    showToast("¡Código de tutores actualizado con éxito!");
  };
  document.getElementById("aj-pin-direccion-guardar").onclick = async ()=>{
    const nuevoPinDireccion = document.getElementById("aj-pin-direccion").value.trim();
    if(nuevoPinDireccion.length < 4){ showToast("El PIN debe tener al menos 4 caracteres/dígitos."); return; }
    DB.pinDireccion = nuevoPinDireccion;
    await saveDB();
    showToast("¡PIN de Dirección actualizado con éxito!");
  };
  document.querySelectorAll("[data-quitar-salon]").forEach(btn=>{
    btn.onclick = ()=>{
      const s = btn.dataset.quitarSalon;
      if(SALONES.length <= 1){ showToast("Debe quedar al menos un salón."); return; }
      showConfirmModal(`¿Quitar "${s}" de los salones activos? Su historial de compras se conserva.`, async ()=>{
        SALONES = SALONES.filter(x=>x!==s);
        DB.salones = SALONES;
        await saveDB();
        document.getElementById("op-content").innerHTML = renderOpAjustes();
        bindOpAjustes();
      }, "Sí, quitar");
    };
  });
  document.getElementById("aj-salon-agregar").onclick = async ()=>{
    const val = document.getElementById("aj-salon-nuevo").value.trim();
    if(!val){ showToast("Escribe el nombre del salón."); return; }
    if(val.length > 40 || /[<>"'&\\]/.test(val)){ showToast("El nombre debe tener máximo 40 caracteres y no usar < > \" ' & \\."); return; }
    if(SALONES.includes(val)){ showToast("Ese salón ya existe."); return; }
    SALONES = [...SALONES, val];
    DB.salones = SALONES;
    migrateDB();
    await saveDB();
    showToast("Salón agregado.");
    document.getElementById("op-content").innerHTML = renderOpAjustes();
    bindOpAjustes();
  };
  document.getElementById("aj-cerrar-ciclo").onclick = ()=>{
    const nuevoCiclo = document.getElementById("aj-nuevo-ciclo").value.trim();
    if(!nuevoCiclo){ showToast("Escribe el nombre del nuevo ciclo."); return; }
    showConfirmModal(`Esto archivará "${DB.ciclo}" en el historial y reiniciará presupuestos, gastos y fondos para "${nuevoCiclo}". Antes de continuar se descargará una copia de seguridad. ¿Continuar?`, async ()=>{
      descargarRespaldoJSON(DB.ciclo + "_antes_de_cerrar");
      DB.historial = DB.historial || [];
      DB.historial.push({
        ciclo: DB.ciclo, salones: SALONES.slice(),
        presupuestos: JSON.parse(JSON.stringify(DB.presupuestos)),
        gastos: JSON.parse(JSON.stringify(DB.gastos)),
        fondos: JSON.parse(JSON.stringify(DB.fondos)),
        cerradoEn: new Date().toISOString()
      });
      DB.ciclo = nuevoCiclo;
      DB.gastos = [];
      DB.fondos = [];
      const presupuestos = {};
      SALONES.forEach(s=>{ presupuestos[s] = {}; MESES.forEach(m=> presupuestos[s][m] = 0); });
      DB.presupuestos = presupuestos;
      await saveDB();
      showToast(`Ciclo cerrado. ${nuevoCiclo} listo para empezar.`);
      render();
    }, "Sí, cerrar ciclo");
  };
  document.getElementById("aj-backup-descargar").onclick = ()=> descargarRespaldoJSON(DB.ciclo);
  document.getElementById("aj-backup-excel").onclick = ()=>{
    const wb = buildWorkbookRespaldoCompleto();
    XLSX.writeFile(wb, `respaldo_completo_caja_chica_${DB.ciclo}.xlsx`);
  };
  document.getElementById("aj-backup-restaurar").onclick = ()=>{
    document.getElementById("aj-backup-file").click();
  };
  document.getElementById("aj-backup-file").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    showConfirmModal("Antes de restaurar, se descargará automáticamente una copia de seguridad de lo que tienes ahora, por si necesitas regresar a esto. Después se reemplazarán todos los datos actuales con los del respaldo elegido. ¿Continuar?", async ()=>{
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        if(!parsed || typeof parsed !== "object" || !Array.isArray(parsed.gastos) || !Array.isArray(parsed.fondos) || !parsed.presupuestos || typeof parsed.presupuestos !== "object"){
          throw new Error("formato");
        }
        descargarRespaldoJSON((DB.ciclo||"actual") + "_antes_de_restaurar");
        DB = parsed;
        migrateDB();
        const okR = await saveDB();
        if(!okR){
          // no se guardó: se vuelve a lo que realmente hay en la nube
          try{ const fresco = await leerAlmacen(); if(fresco){ DB = fresco; migrateDB(); } }catch(e2){}
          render();
          return;
        }
        showToast("Respaldo restaurado. Se descargó una copia de tus datos anteriores por seguridad.");
        render();
      }catch(err){
        showToast("El archivo no es un respaldo válido.");
      }
    }, "Sí, restaurar");
  };
  document.getElementById("aj-sheets-guardar").onclick = async ()=>{
    const url = document.getElementById("aj-sheets-url").value.trim();
    if(url){
      try{ new URL(url); }catch(e){ showToast("La URL no es válida."); return; }
    }
    try{
      if(url) localStorage.setItem(URL_LOCAL_KEY, url); else localStorage.removeItem(URL_LOCAL_KEY);
    }catch(e){ showToast("No se pudo guardar la conexión en este dispositivo."); return; }
    showToast("Conexión con Sheets guardada. Recargando…");
    setTimeout(()=>location.reload(), 900);
  };
  document.getElementById("aj-sheets-probar").onclick = async ()=>{
    const url = document.getElementById("aj-sheets-url").value.trim();
    if(!url){ showToast("Pega primero la URL de tu Aplicación web."); return; }
    const ok = await enviarASheets("Prueba", ["Fecha","Mensaje"], [new Date().toLocaleString("es-MX"), "Conexión de prueba desde Caja Chica"], url);
    showToast(ok ? "Enviado. Revisa tu hoja en unos segundos." : "No se pudo enviar. Revisa la URL y que el acceso sea \"Cualquier usuario\".");
  };
}

function mesDeFecha(fechaStr){
  if(!fechaStr) return null;
  const partes = fechaStr.split("-");
  if(partes.length<2) return null;
  const mesNum = Number(partes[1]); // 1-12
  const mapa = {8:"Agosto",9:"Septiembre",10:"Octubre",11:"Noviembre",12:"Diciembre",1:"Enero",2:"Febrero",3:"Marzo",4:"Abril",5:"Mayo",6:"Junio",7:"Julio"};
  return mapa[mesNum] || null;
}
function fondosDelMes(mes){
  return DB.fondos.filter(f=> mesDeFecha(f.fecha)===mes);
}
function gastosDelMesTodos(mes){
  return DB.gastos.filter(g=>g.mes===mes).slice().sort((a,b)=>a.salon.localeCompare(b.salon));
}

function buildWorkbookGeneral(){
  const wb = XLSX.utils.book_new();

  resumenRows.push([]);
  resumenRows.push(["Total", SALONES.reduce((a,s)=>a+presupuestoCiclo(s),0), SALONES.reduce((a,s)=>a+totalGastadoCiclo(s),0)]);
  resumenRows.push([]);
  resumenRows.push(["Fondos recibidos de Dirección"]);
  resumenRows.push(["Fecha","Monto","Concepto","Registró"]);
  DB.fondos.slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).forEach(f=> resumenRows.push([f.fecha, Number(f.monto)||0, f.concepto||"", f.registradoPor||""]));
  const wsResumen = XLSX.utils.aoa_to_sheet(resumenRows);
  XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen general");
  SALONES.forEach(s=>{
    XLSX.utils.book_append_sheet(wb, hojaDetalleSalon(s), s.slice(0,31));

  return wb;
}

function renderPromedioSalones(){
  const idx = MESES.map((m,i)=> DB.gastos.some(g=>g.mes===m) ? i : -1).filter(i=>i>=0);
  const nMeses = idx.length ? Math.max(...idx) - Math.min(...idx) + 1 : 0; // meses transcurridos con movimiento
  let totGlobal = 0;
  const filas = SALONES.map(s=>{
    const porMes = MESES.map(m=>totalGastado(s,m));
    const total = porMes.reduce((a,b)=>a+b,0);
    totGlobal += total;
    const conGasto = porMes.filter(v=>v>0).length;
    const max = Math.max(0, ...porMes);
    const hist = (DB.historial||[]).map(h=>{
      const ms = new Set((h.gastos||[]).map(g=>g.mes));
      const t = (h.gastos||[]).filter(g=>g.salon===s).reduce((a,g)=>a+Number(g.costo||0),0);
      return ms.size ? t/ms.size : null;
    }).filter(v=>v!==null);
    return { s, total, prom: nMeses ? total/nMeses : 0, promActivos: conGasto ? total/conGasto : 0,
      mesMax: max>0 ? `${MESES[porMes.indexOf(max)]} (${fmtMoney(max)})` : "—",
      presProm: presupuestoCiclo(s)/MESES.length, promHist: hist.length ? hist.reduce((a,b)=>a+b,0)/hist.length : null };
  });
  return `
  <div class="card" style="margin-bottom:22px;overflow-x:auto;">
    <p class="section-title"><span class="dot"></span>Gasto promedio mensual por salón</p>
    <p class="small-muted" style="margin-top:0;">Referencia para medir el gasto de cada área en el ciclo ${DB.ciclo} (${nMeses} ${nMeses===1?"mes":"meses"} con movimiento). Es solo informativo: no modifica presupuestos ni gastos.</p>
    <table>
      <tr><th>Salón</th><th>Gasto del ciclo</th><th>Promedio mensual</th><th>Promedio (meses con gasto)</th><th>Mes más alto</th><th>Presupuesto mensual prom.</th><th>Prom. ciclos anteriores</th></tr>
      ${filas.map(f=>`<tr><td>${f.s}</td><td>${fmtMoney(f.total)}</td><td><strong>${fmtMoney(f.prom)}</strong></td><td>${fmtMoney(f.promActivos)}</td><td>${f.mesMax}</td><td>${fmtMoney(f.presProm)}</td><td>${f.promHist===null?"—":fmtMoney(f.promHist)}</td></tr>`).join("")}
      <tr class="rp-total"><td>Total</td><td>${fmtMoney(totGlobal)}</td><td><strong>${fmtMoney(nMeses ? totGlobal/nMeses : 0)}</strong></td><td></td><td></td><td></td><td></td></tr>
    </table>
  </div>`;
}

function filtrarGastos(fs, fm, fq, fd1, fd2){
  let list = DB.gastos.slice().sort((a,b)=> (b.registradoEn||"").localeCompare(a.registradoEn||""));
  if(fs && fs!=="Todos") list = list.filter(g=>g.salon===fs);
  if(fm && fm!=="Todos") list = list.filter(g=>g.mes===fm);
  if(fq && fq.trim()){
    const q = fq.trim().toLowerCase();
    list = list.filter(g=> (g.concepto||"").toLowerCase().includes(q) || (g.observacion||"").toLowerCase().includes(q));
  }
  const fechaRef = g => g.fechaPedido || g.fechaEntrega || (g.registradoEn ? g.registradoEn.slice(0,10) : "");
  if(fd1) list = list.filter(g=> fechaRef(g) && fechaRef(g) >= fd1);
  if(fd2) list = list.filter(g=> fechaRef(g) && fechaRef(g) <= fd2);
  return list;
}
function renderTablaGastos(fs, fm, fq, fd1, fd2){

  </table>`;
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function descargarRespaldoJSON(sufijo){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `respaldo_caja_chica_${sufijo}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

function buildWorkbookRespaldoCompleto(){

  const gastoRows = [["Salón","Mes","Concepto","Cantidad","Costo","Fecha pedido","Fecha entrega","Avisó con anticipación","Observación","Registró","ID","Editado por","Editado en"]];
  DB.gastos.forEach(g=>{

  const fondoRows = [["Fecha","Monto","Concepto","Registró","ID","Editado por","Editado en"]];

  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fondoRows), "Fondos");

  const presuRows = [["Salón", ...MESES]];

  return wb;

function tamanoDBBytes(){
  try{ return new Blob([JSON.stringify(DB)]).size; }catch(e){ return 0; }
}
const LIMITE_STORAGE_BYTES = 5*1024*1024;
let avisoTamanoMostrado = false;
function revisarTamanoDB(){
  const bytes = tamanoDBBytes();
  if(bytes > LIMITE_STORAGE_BYTES*0.8 && !avisoTamanoMostrado){
    avisoTamanoMostrado = true;
    showToast("La base de datos está llegando a su límite de tamaño. Ve a Ajustes para archivar ciclos antiguos.");
  }
  return bytes;
}

function bindTutorTabEvents(){
  if(state.tab==="observaciones"){
    marcarObservacionesLeidas(state.salon).then(()=>{
      const badge = document.querySelector('.tab[data-ttab="observaciones"] .badge-count');
      if(badge) badge.remove();
    });
  }
  const sel = document.getElementById("tt-mes");
  if(sel) sel.onchange = ()=>{ state.mes = sel.value; document.getElementById("tt-content").innerHTML = renderTutorTab(); bindTutorTabEvents(); };
  const btnDesc = document.getElementById("tt-descargar");
  if(btnDesc) btnDesc.onclick = ()=>{
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, hojaDetalleSalon(state.salon), state.salon.slice(0,31));
    XLSX.writeFile(wb, `historial_${state.salon}_${DB.ciclo}.xlsx`);
  };
  const btnDescMes = document.getElementById("tt-descargar-mes");
  if(btnDescMes) btnDescMes.onclick = ()=>{
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, hojaDetalleSalonMes(state.salon, state.mes), state.salon.slice(0,31));
    XLSX.writeFile(wb, `${state.salon}_${state.mes}_${DB.ciclo}.xlsx`);
  };
  const btnImpMes = document.getElementById("tt-imprimir-mes");
  if(btnImpMes) btnImpMes.onclick = ()=> imprimirReporteMes(state.salon, state.mes);
}
function renderTutorGastos(){
  const info = infoMensualSalon(state.salon)[state.mes];
  const list = gastosDeSalonMes(state.salon, state.mes);
  const arrastreTxt = info.arrastre > 0
    ? `<p class="metric-sub" style="color:var(--sage-600);">+ ${fmtMoney(info.arrastre)} arrastrado del mes anterior</p>`
    : info.arrastre < 0
      ? `<p class="metric-sub" style="color:var(--brick-700);">− ${fmtMoney(Math.abs(info.arrastre))} descontado por sobregasto</p>`
      : "";
  return `
  <div class="flex-between" style="margin-bottom:16px;gap:12px;flex-wrap:wrap;">
    <div>
      <button class="btn btn-primary" id="tt-descargar-mes">Descargar Excel de este mes</button>
      <button class="btn btn-secondary" id="tt-imprimir-mes" style="margin-left:8px;">Imprimir / PDF de este mes</button>
    </div>
    <select id="tt-mes" style="width:160px;">${MESES.map(m=>`<option ${m===state.mes?'selected':''}>${m}</option>`).join("")}</select>
  </div>
  <div class="grid grid-4" style="margin-bottom:6px;">
    <div class="card"><p class="metric-label">Presupuesto asignado</p><p class="metric-value">${fmtMoney(info.base)}</p></div>
    <div class="card"><p class="metric-label">Disponible este mes</p><p class="metric-value">${fmtMoney(info.disponible)}</p>${arrastreTxt}</div>
    <div class="card"><p class="metric-label">Gastado</p><p class="metric-value">${fmtMoney(info.gastado)}</p>${tagAlerta(info.gastado, info.disponible)?`<p class="metric-sub">${tagAlerta(info.gastado, info.disponible)}</p>`:""}</div>
    <div class="card"><p class="metric-label">Restante</p><p class="metric-value" style="color:${info.restante<0?'#A6453D':'#16281F'}">${fmtMoney(info.restante)}</p></div>
  </div>
  <p class="small-muted" style="margin:0 0 20px;">El restante de cada mes se suma o se descuenta automáticamente del siguiente.</p>
  <div class="card" style="overflow-x:auto;">
    <p class="section-title"><span class="dot"></span>Pedidos de ${state.mes}</p>
    ${list.length===0 ? `<div class="empty">Sin pedidos registrados este mes.</div>` : `
    <table>
      <tr><th>Concepto</th><th>Cantidad</th><th>Costo</th><th>Fecha pedido</th><th>Fecha entrega</th></tr>
      ${list.map(x=>`<tr><td>${escAttr(x.concepto)}</td><td>${escAttr(x.cantidad||"—")}</td><td>${fmtMoney(x.costo)}</td><td>${x.fechaPedido||"—"}</td><td>${x.fechaEntrega||"—"}</td></tr>`).join("")}
    </table>`}
  </div>`;
}
function renderTutorObservaciones(){
  const notas = gastosDeSalon(state.salon).filter(g=>g.observacion && g.observacion.trim())
    .sort((a,b)=>(b.registradoEn||"").localeCompare(a.registradoEn||""));
  if(notas.length===0) return `<div class="card"><div class="empty">Tu salón no tiene observaciones registradas.</div></div>`;
  return `<div class="card">
    <p class="section-title"><span class="dot"></span>Observaciones de ${state.salon}</p>
    ${notas.map(n=>`<div class="note-item"><div class="meta">${n.mes} · ${escAttr(n.concepto)}</div>${escAttr(n.observacion)}</div>`).join("")}
  </div>`;
}
function renderTutorAnual(){
  const info = infoMensualSalon(state.salon);
  const pTotal = presupuestoCiclo(state.salon);
  const gTotal = totalGastadoCiclo(state.salon);
  return `
  <div class="flex-between" style="margin-bottom:16px;">
    <div></div>
    <button class="btn btn-secondary" id="tt-descargar">Descargar mi historial (Excel)</button>
  </div>
  <div class="grid grid-4" style="margin-bottom:22px;">
    <div class="card"><p class="metric-label">Presupuesto del ciclo</p><p class="metric-value">${fmtMoney(pTotal)}</p></div>
    <div class="card"><p class="metric-label">Gastado en el ciclo</p><p class="metric-value">${fmtMoney(gTotal)}</p></div>
    <div class="card"><p class="metric-label">Restante</p><p class="metric-value" style="color:${(pTotal-gTotal)<0?'#A6453D':'#16281F'}">${fmtMoney(pTotal-gTotal)}</p></div>
  </div>
  <div class="card" style="overflow-x:auto;">
    <p class="section-title"><span class="dot"></span>Detalle por mes — ${state.salon}</p>
    <table>
      <tr><th>Mes</th><th>Asignado</th><th>Arrastre</th><th>Disponible</th><th>Gastado</th><th>Restante</th></tr>
      ${MESES.map(m=>{
        const i = info[m];
        return `<tr><td>${m}</td><td>${fmtMoney(i.base)}</td><td style="color:${i.arrastre<0?'#A6453D':i.arrastre>0?'#4F7359':'inherit'}">${i.arrastre===0?'—':(i.arrastre>0?'+':'')+fmtMoney(i.arrastre)}</td><td>${fmtMoney(i.disponible)}</td><td>${fmtMoney(i.gastado)}</td><td style="color:${i.restante<0?'#A6453D':'inherit'}">${fmtMoney(i.restante)}</td></tr>`;
      }).join("")}
    </table>
  </div>`;
}

loadDB();
</script>
</body>
</html>
