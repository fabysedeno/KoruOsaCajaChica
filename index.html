<html lang="es-MX">

<title>Caja Chica</title>

<style>
/* --forest-700 (#4D5414) es el verde exacto medido del logotipo (promedio
   real de sus píxeles, no un tono "parecido" a ojo) — por eso los acentos
   principales (botones, pestaña activa, notificaciones) usan ese tono
   directamente. --forest-900 se reserva para texto de alto contraste. */
:root{
  --forest-900:#2E3010; --forest-700:#4D5414;
  --sage-600:#6E7526; --sage-500:#8B9142; --sage-100:#E8E9D6; --sage-50:#F3F4EA;
  --parchment:#F7F5EC; --card:#FFFFFF;
  --gold-700:#8C6A2E; --gold-600:#B98B3E; --gold-100:#F3E6CB;
  --brick-700:#7C332C; --brick-600:#A6453D; --brick-100:#F5DEDC;
  --ink-900:#201F16; --ink-700:#3A3930; --ink-500:#75736A;
  --line:#DDD8C4; --radius:10px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--parchment);color:var(--ink-900);font-family:var(--font-sans);}
h1,h2,h3{font-family:var(--font-serif);}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px;}

.acceso-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.acceso-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px;max-width:340px;width:100%;text-align:center;}
.acceso-card h1{color:var(--forest-900);margin:0 0 4px;}
.acceso-botones{display:flex;flex-direction:column;gap:10px;margin-top:18px;}

.topbar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:22px 20px 18px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1{font-size:22px;font-weight:600;margin:0;color:var(--forest-900);}
.brand span{display:block;font-size:12.5px;color:var(--ink-500);margin-top:1px;}
.logo-topbar{height:36px;width:auto;max-width:140px;object-fit:contain;}
.logo-acceso{height:64px;width:auto;max-width:220px;object-fit:contain;margin:0 auto 14px;display:block;}
.role-pill{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--forest-700);background:var(--sage-50);border:1px solid var(--sage-100);padding:7px 14px;border-radius:100px;}
.role-pill button{background:none;border:none;color:var(--brick-700);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;}

.tabs{max-width:1100px;margin:0 auto 20px;padding:0 20px;display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{background:none;border:none;padding:10px 4px;margin-right:20px;font-size:13.5px;font-weight:600;color:var(--ink-500);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.activo{color:var(--forest-900);border-bottom-color:var(--forest-700);}

.contenido{max-width:1100px;margin:0 auto;padding:0 20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:720px){.grid-2,.grid-4{grid-template-columns:1fr;}}

.metric-label{font-size:12.5px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
.metric-value{font-size:26px;font-weight:600;font-family:'Fraunces',serif;margin:0;color:var(--forest-900);}

.section-title{font-size:15px;font-weight:600;color:var(--forest-900);margin:0 0 12px;}
.small-muted{font-size:12.5px;color:var(--ink-500);}

.field{margin-bottom:12px;}
label{font-size:12.5px;color:var(--ink-700);font-weight:600;display:block;margin-bottom:5px;}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-900);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage-500);box-shadow:0 0 0 3px var(--sage-50);}

.btn{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:10px 16px;border-radius:8px;border:none;}
.btn-primary{background:var(--forest-700);color:#fff;}
.btn-primary:hover{background:var(--forest-900);}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink-700);}
.btn-secondary:hover{border-color:var(--sage-500);color:var(--sage-600);}
.btn:disabled{opacity:.6;cursor:default;}
.link-btn{background:none;border:none;color:var(--sage-600);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;font-family:inherit;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:12px;color:var(--ink-500);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:10px;border-bottom:1px solid var(--sage-50);color:var(--ink-900);font-size:13.5px;}

.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;}
.tag-ok{background:var(--sage-100);color:var(--sage-600);}
.tag-warn{background:var(--gold-100);color:var(--gold-700);}
.tag-bad{background:var(--brick-100);color:var(--brick-700);}

.empty{color:var(--ink-500);font-size:13.5px;padding:20px 0;text-align:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}

.modal-bg{position:fixed;inset:0;background:rgba(32,31,22,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:480px;width:100%;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest-700);color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s, transform .25s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

</style>
</head>

// ESTADO CENTRAL
// ============================================================
// Un solo lugar con "la verdad" de qué hay cargado y en qué pantalla
// está el usuario. Las vistas leen de aquí; nadie más guarda copias
// sueltas de los datos.



const state = {
  role: null,       // "operaciones" | "direccion" | "tutor" | null
  salon: null,       // salón elegido (rol tutor)
  tab: "resumen",
  cargando: true,
  mesesCiclo: MESES, // ciclo escolar fijo (sep–jun); si cambia, se edita en config.js

  // Datos vivos, refrescados desde el servidor con cargarTodo()
  config: { ciclo: "", salones: [], presupuestos: {} },
  gastos: [],
  fondos: [],
  observaciones: [],
  historial: []
};

function esSoloLectura(){
  return state.role === "direccion";
}


// ============================================================
// UTILIDADES PURAS
// (antes: js/utils.js)
// ============================================================
// ============================================================
// UTILIDADES PURAS
// ============================================================
// Funciones sin efectos secundarios: reciben datos, regresan datos.
// No tocan el DOM ni la red. Esto es lo que hace posible reutilizarlas
// igual en la pantalla de Operaciones, la de Tutor y en los reportes.



function fmtMoney(n){
  const v = Number(n) || 0;
  return "$" + v.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escAttr(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function uid(){
  // Solo se usa para claves temporales de UI (por ejemplo filas de una
  // lista aún no guardada). Los IDs "de verdad" los asigna el servidor
  // al guardar, para evitar colisiones entre distintos dispositivos.
  return Math.random().toString(36).slice(2, 10);
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function gastosDeSalon(salon){ return state.gastos.filter(g => g.salon === salon); }
function gastosDeSalonMes(salon, mes){ return gastosDeSalon(salon).filter(g => g.mes === mes); }
function totalGastado(salon, mes){ return gastosDeSalonMes(salon, mes).reduce((a, g) => a + (Number(g.costo) || 0), 0); }
function totalGastadoCiclo(salon){ return gastosDeSalon(salon).reduce((a, g) => a + (Number(g.costo) || 0), 0); }
function presupuestoMes(salon, mes){ return Number(state.config.presupuestos?.[salon]?.[mes] || 0); }
function presupuestoCiclo(salon){
  return (state.mesesCiclo || []).reduce((a, m) => a + presupuestoMes(salon, m), 0);
}
function totalGastadoMesTodos(mes){
  return state.config.salones.reduce((a, s) => a + totalGastado(s, mes), 0);
}
function totalPresupuestoMesTodos(mes){
  return state.config.salones.reduce((a, s) => a + presupuestoMes(s, mes), 0);
}
function mesConDatosMasReciente(){
  const meses = state.mesesCiclo || [];
  const conDatos = meses.filter(m => totalGastadoMesTodos(m) > 0 || totalPresupuestoMesTodos(m) > 0);
  return conDatos.length ? conDatos[conDatos.length - 1] : meses[0];
}

function totalFondosRecibidos(){ return state.fondos.reduce((a, f) => a + (Number(f.monto) || 0), 0); }
function totalGastoGeneral(){ return state.gastos.reduce((a, g) => a + (Number(g.costo) || 0), 0); }
function saldoDisponible(){ return totalFondosRecibidos() - totalGastoGeneral(); }

function nivelAlerta(gastado, disponible){
  if(disponible <= 0) return gastado > 0 ? "sobregasto" : "ok";
  const pct = gastado / disponible;
  if(pct > 1) return "sobregasto";
  if(pct >= 0.8) return "atencion";
  return "ok";
}

function tagAlerta(gastado, disponible){
  const nivel = nivelAlerta(gastado, disponible);
  if(nivel === "sobregasto") return `<span class="tag tag-bad">Sobregasto</span>`;
  if(nivel === "atencion") return `<span class="tag tag-warn">Cerca del límite</span>`;
  return `<span class="tag tag-ok">En orden</span>`;
}

/** Info mensual acumulada (con arrastre de saldo entre meses) para un salón. */
function infoMensualSalon(salon){
  const info = {};
  let arrastre = 0;
  (state.mesesCiclo || []).forEach(m => {
    const presu = presupuestoMes(salon, m);
    const gastado = totalGastado(salon, m);
    const disponible = presu + arrastre;
    const restante = disponible - gastado;
    info[m] = { presupuesto: presu, gastado, disponible, restante, arrastre };
    arrastre = restante;
  });
  return info;
}

/** Meses del ciclo que ya tienen presupuesto o gasto (para no diluir el promedio con meses futuros vacíos). */
function mesesConDatos(salon){
  return (state.mesesCiclo || []).filter(m => presupuestoMes(salon, m) > 0 || totalGastado(salon, m) > 0).length;
}
function promedioMensualSalon(salon){
  const n = mesesConDatos(salon);
  return n === 0 ? 0 : totalGastadoCiclo(salon) / n;
}

// Único lugar del proyecto que sabe cómo hablar con el backend
// (Google Apps Script). El resto de la app no hace fetch() directo:
// llama a estas funciones. Si el día de mañana cambian de backend
// (por ejemplo a Firebase), solo se reescribe este archivo.



let token = sessionStorage.getItem("cc_token") || null;
let role = sessionStorage.getItem("cc_role") || null;

function getSesion(){ return { token, role }; }

function guardarSesion(t, r){
  token = t; role = r;
  sessionStorage.setItem("cc_token", t);
  sessionStorage.setItem("cc_role", r);
}

function cerrarSesionLocal(){
  token = null; role = null;
  sessionStorage.removeItem("cc_token");
  sessionStorage.removeItem("cc_role");
}

/**
 * Antes de siquiera intentar la petición, revisa que API_URL (en
 * js/config.js) de verdad se haya configurado. Evita mandar una petición
 * que va a fallar de forma confusa, y en vez de eso explica exactamente
 * qué revisar.
 */
function verificarUrlConfigurada(){
  if(!API_URL || API_URL.includes("PEGA_AQUI") || !/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)){
    throw new Error(
      "El sitio todavía no tiene configurada la URL del backend. Abre js/config.js, " +
      "reemplaza API_URL con la URL que termina en /exec de tu implementación de Apps Script, " +
      "y vuelve a generar index.html con build.py."
    );
  }
}

/**
 * Lee la respuesta como texto primero (no con res.json() directo) para
 * poder dar un mensaje claro si lo que llegó no es JSON — típicamente
 * porque Google devolvió una página de inicio de sesión en HTML en vez
 * de la respuesta del script. Ese caso se ve en la consola como
 * "Unexpected token '<', "<!DOCTYPE "... is not valid JSON", que para
 * quien no programa no dice nada — aquí se traduce a algo accionable.
 */
async function procesarRespuesta(res){
  const texto = await res.text();
  let data;
  try{
    data = JSON.parse(texto);
  }catch(e){
    const pareceHTML = /^\s*<(!DOCTYPE|html)/i.test(texto);
    if(pareceHTML){
      throw new Error(
        "El servidor respondió con una página en vez de datos (esto suele pasar cuando la " +
        "implementación de Apps Script no está configurada como \"Cualquier usuario\", o cuando " +
        "la URL copiada no es la de /exec). Revisa en Apps Script: Implementar → Administrar " +
        "implementaciones → que \"Quién tiene acceso\" diga \"Cualquier usuario\", y que la URL en " +
        "js/config.js sea exactamente la que termina en /exec."
      );
    }
    throw new Error("El servidor respondió algo que no se pudo leer (" + e.message + ").");
  }
  if(!res.ok && !data){
    throw new Error(`El servidor respondió con un error (${res.status}).`);
  }
  if(!data.ok) throw new Error(data.error || "Error desconocido del servidor.");
  return data;
}

async function post(action, payload = {}){
  verificarUrlConfigurada();
  const res = await fetch(API_URL, {
    method: "POST",
    // Importante: NO se define un header "Content-Type: application/json" a
    // propósito. Un fetch con body de texto sin ese header se considera una
    // "solicitud simple" y el navegador NO manda una petición OPTIONS previa
    // (preflight) — Apps Script Web Apps no responden bien a esas. Así se
    // evitan errores de CORS sin tener que montar un servidor propio.
    body: JSON.stringify({ action, payload, token })
  });
  return procesarRespuesta(res);
}

async function get(params = {}){
  verificarUrlConfigurada();
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return procesarRespuesta(res);
}

const api = {
  obtenerTodo: () => get({ action: "getAll" }),

  login: (pin, tipo) => post("login", { pin, tipo }),
  logout: () => post("logout"),

  addGasto: (gasto) => post("addGasto", gasto),
  addGastosLote: (payload) => post("addGastosLote", payload),
  updateGasto: (gasto) => post("updateGasto", gasto),
  deleteGasto: (id) => post("deleteGasto", { id }),

  addFondo: (fondo) => post("addFondo", fondo),
  updateFondo: (fondo) => post("updateFondo", fondo),
  deleteFondo: (id) => post("deleteFondo", { id }),

  setPresupuestos: (presupuestos) => post("setPresupuestos", { presupuestos }),
  updateConfig: (cfg) => post("updateConfig", cfg),

  addObservacion: (obs) => post("addObservacion", obs),
  deleteObservacion: (id) => post("deleteObservacion", { id }),

  cerrarCiclo: (payload) => post("cerrarCiclo", payload),
  revertirCierre: (id) => post("revertirCierre", { id })
};

    <table>
      <tr><th>Salón</th>${meses.map(m => `<th>${m.slice(0, 3)}</th>`).join("")}<th>Total</th><th>Promedio/mes</th></tr>
      ${salones.map(s => `<tr><td>${s}</td>${meses.map(m => `<td>${totalGastado(s, m) > 0 ? fmtMoney(totalGastado(s, m)) : "—"}</td>`).join("")}<td style="font-weight:600;">${fmtMoney(totalGastadoCiclo(s))}</td><td style="color:var(--ink-500);">${fmtMoney(promedioMensualSalon(s))}</td></tr>`).join("")}

}

// automáticamente porque corría dentro del entorno de Claude, con acceso

// Por honestidad, la quité de esta versión en vez de dejar un botón que

let comprasPendientes = [];

function renderRegistrar(){
  const salones = state.config.salones;
  const meses = state.mesesCiclo;
  return `
  <div class="card" style="max-width:640px;">
    <p class="section-title">Registrar compras</p>
    <p class="small-muted" style="margin-top:-6px;">Agrega cada insumo con su precio a la lista. Cuando termines, regístralos todos juntos en un solo paso — no hace falta repetir el formulario compra por compra.</p>
    <div class="grid grid-2">
      <div class="field"><label>Salón</label><select id="rg-salon">${salones.map(s => `<option>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Mes</label><select id="rg-mes">${meses.map(m => `<option>${m}</option>`).join("")}</select></div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Fecha del pedido</label><input id="rg-fpedido" type="date"></div>
      <div class="field"><label>Fecha de entrega</label><input id="rg-fentrega" type="date"></div>
    </div>
    <div class="field"><label><input type="checkbox" id="rg-aviso" style="width:auto;display:inline-block;margin-right:6px;">Se avisó con anticipación</label></div>
    <div class="field"><label>Observación (opcional, aplica a todos los insumos de este registro)</label><textarea id="rg-obs" rows="2"></textarea></div>

    <div style="border-top:1px solid var(--line);margin:16px 0 14px;padding-top:14px;">
      <p class="section-title" style="font-size:13.5px;">Agregar insumo a la lista</p>
      <div class="grid grid-2">
        <div class="field"><label>Insumo / concepto</label><input id="rg-concepto" placeholder="Ej. Harina integral"></div>
        <div class="field"><label>Cantidad (opcional)</label><input id="rg-cantidad" placeholder="Ej. 5 kg"></div>
      </div>
      <div class="field"><label>Precio ($)</label><input id="rg-costo" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <button class="btn btn-secondary" id="rg-agregar">+ Agregar insumo</button>
    </div>
    <div id="rg-lista">${renderLista()}</div>
  </div>`;
}

function renderLista(){
  if(comprasPendientes.length === 0) return `<p class="small-muted">Aún no has agregado ningún insumo.</p>`;
  const total = comprasPendientes.reduce((a, it) => a + Number(it.costo || 0), 0);
  return `
    <table>
      <tr><th>Insumo</th><th>Cantidad</th><th>Precio</th><th></th></tr>
      ${comprasPendientes.map((it, idx) => `<tr><td>${escAttr(it.concepto)}</td><td>${escAttr(it.cantidad || "—")}</td><td>${fmtMoney(it.costo)}</td><td><button class="link-btn" data-quitar="${idx}">Quitar</button></td></tr>`).join("")}
    </table>
    <div class="flex-between" style="margin-top:12px;flex-wrap:wrap;gap:10px;">
      <p style="margin:0;font-weight:600;">Total: ${fmtMoney(total)} · ${comprasPendientes.length} insumo${comprasPendientes.length === 1 ? "" : "s"}</p>
      <button class="btn btn-primary" id="rg-registrar-todo">Registrar todas las compras</button>
    </div>`;
}

function bindRegistrar(onGuardado){
  const campoConcepto = document.getElementById("rg-concepto");
  const campoCantidad = document.getElementById("rg-cantidad");
  const campoCosto = document.getElementById("rg-costo");

  document.getElementById("rg-agregar").onclick = () => {
    const concepto = campoConcepto.value.trim();
    const costo = Number(campoCosto.value);
    if(!concepto){ showToast("Escribe el insumo antes de agregarlo."); return; }
    if(!costo || costo <= 0){ showToast("El precio debe ser mayor a $0."); return; }
    comprasPendientes.push({ concepto, cantidad: campoCantidad.value.trim(), costo });
    campoConcepto.value = ""; campoCantidad.value = ""; campoCosto.value = "";
    refrescarLista(onGuardado);
    campoConcepto.focus();
  };
  campoConcepto.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); campoCosto.focus(); } });
  campoCosto.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); document.getElementById("rg-agregar").click(); } });

  bindBotonesLista(onGuardado);
}

function refrescarLista(onGuardado){
  document.getElementById("rg-lista").innerHTML = renderLista();
  bindBotonesLista(onGuardado);
}

function bindBotonesLista(onGuardado){
  document.querySelectorAll("[data-quitar]").forEach(btn => {
    btn.onclick = () => { comprasPendientes.splice(Number(btn.dataset.quitar), 1); refrescarLista(onGuardado); };
  });
  const btnTodo = document.getElementById("rg-registrar-todo");
  if(!btnTodo) return;
  btnTodo.onclick = () => {
    const salon = document.getElementById("rg-salon").value;
    const mes = document.getElementById("rg-mes").value;
    const fechaPedido = document.getElementById("rg-fpedido").value;
    const fechaEntrega = document.getElementById("rg-fentrega").value;
    const avisoAnticipado = document.getElementById("rg-aviso").checked;
    const observacion = document.getElementById("rg-obs").value.trim();
    if(comprasPendientes.length === 0){ showToast("Agrega al menos un insumo."); return; }
    if(fechaPedido && fechaEntrega && fechaEntrega < fechaPedido){ showToast("La fecha de entrega no puede ser anterior a la del pedido."); return; }

    const total = comprasPendientes.reduce((a, it) => a + Number(it.costo || 0), 0);
    const infoAntes = infoMensualSalon(salon)[mes];
    let avisoExtra = "";
    if(infoAntes){
      const gastadoDespues = infoAntes.gastado + total;
      if(infoAntes.disponible > 0 && gastadoDespues > infoAntes.disponible){
        avisoExtra = `<p style="color:var(--brick-700);font-weight:600;margin-top:10px;">⚠️ Con estas compras, ${salon} se pasa del presupuesto disponible de ${mes}.</p>`;
      }
    }
    showConfirmModal(`
      <div style="text-align:left;">
        <p><strong>Confirma el registro de ${comprasPendientes.length} insumo${comprasPendientes.length === 1 ? "" : "s"}:</strong></p>
        <p>${salon} · ${mes}</p>
        <ul style="padding-left:18px;font-size:13px;">${comprasPendientes.map(it => `<li>${escAttr(it.concepto)}${it.cantidad ? ` (${escAttr(it.cantidad)})` : ""} — ${fmtMoney(it.costo)}</li>`).join("")}</ul>
        <p style="font-weight:600;">Total: ${fmtMoney(total)}</p>
        ${avisoExtra}
      </div>`, async () => {
      const items = comprasPendientes.slice();
      btnTodo.disabled = true;
      try{
        const res = await api.addGastosLote({
          salon, mes, fechaPedido, fechaEntrega, avisoAnticipado, observacion,
          items: items.map(it => ({ concepto: it.concepto, cantidad: it.cantidad, costo: it.costo }))
        });
        // Actualización optimista: el servidor ya confirmó y nos regresó los
        // IDs reales — con eso armamos los gastos localmente y los sumamos a
        // `state.gastos` de una vez, sin esperar una segunda vuelta de red
        // solo para volver a traer lo que ya sabemos. Así, si la persona
        // cambia a "Todos los gastos" ahora mismo, ya los va a ver ahí.
        const registradoEn = new Date().toISOString();
        items.forEach((it, i) => {
          state.gastos.push({
            id: res.ids[i], salon, mes, concepto: it.concepto, cantidad: it.cantidad, costo: it.costo,
            fechaPedido, fechaEntrega, avisoAnticipado, observacion,
            registradoEn, registradoPor: state.role === "direccion" ? "Dirección" : "Operaciones", registradoRol: state.role
          });
        });
        showToast(`${items.length} compra${items.length === 1 ? "" : "s"} registrada${items.length === 1 ? "" : "s"}.`);
        comprasPendientes = [];
        refrescarLista(onGuardado);
        onGuardado(); // reconciliación silenciosa de fondo, sin bloquear ni recargar la pantalla ahora mismo
      }catch(e){
        showToast("No se pudo registrar: " + e.message);
      }
      btnTodo.disabled = false;
    }, "Sí, registrar todo");
  };
}

function renderGastos(){

  const meses = ["Todos", ...state.mesesCiclo];
  return `
  <div class="card" style="margin-bottom:16px;">
    <p class="section-title">Todos los gastos</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="margin:0;flex:1;min-width:160px;"><label>Buscar</label><input id="fg-buscar" placeholder="Concepto u observación..."></div>
      <div class="field" style="margin:0;"><label>Salón</label><select id="fg-salon">${salones.map(s => `<option>${s}</option>`).join("")}</select></div>
      <div class="field" style="margin:0;"><label>Mes</label><select id="fg-mes">${meses.map(m => `<option>${m}</option>`).join("")}</select></div>
    </div>
  </div>
  <div class="card" id="gastos-tabla-wrap" style="overflow-x:auto;">${renderTabla("Todos", "Todos", "")}</div>`;
}

function filtrar(fs, fm, fq){
  let list = state.gastos.slice().sort((a, b) => (b.registradoEn || "").localeCompare(a.registradoEn || ""));
  if(fs && fs !== "Todos") list = list.filter(g => g.salon === fs);
  if(fm && fm !== "Todos") list = list.filter(g => g.mes === fm);
  if(fq && fq.trim()){
    const q = fq.trim().toLowerCase();
    list = list.filter(g => (g.concepto || "").toLowerCase().includes(q) || (g.observacion || "").toLowerCase().includes(q));
  }
  return list;
}

function renderTabla(fs, fm, fq){
  const list = filtrar(fs, fm, fq);
  const esDireccion = state.role === "direccion";
  if(list.length === 0) return `<div class="empty">Sin gastos con estos filtros.</div>`;
  return `<table>
    <tr><th>Salón</th><th>Mes</th><th>Concepto</th><th>Cant.</th><th>Costo</th><th>Entrega</th><th>Registró</th><th></th></tr>
    ${list.map(g => {
      const esPropio = g.registradoRol === "direccion";
      let acciones = "";
      if(esDireccion){
        acciones = esPropio ? `<button class="link-btn" data-edit="${g.id}">Editar</button> · <button class="link-btn" data-del="${g.id}">Eliminar</button>` : "";
      } else if(state.role === "operaciones"){
        acciones = `<button class="link-btn" data-edit="${g.id}">Editar</button> · <button class="link-btn" data-del="${g.id}">Eliminar</button>`;
      }
      return `<tr>
        <td>${escAttr(g.salon)}</td><td>${escAttr(g.mes)}</td><td>${escAttr(g.concepto)}</td>
        <td>${escAttr(g.cantidad || "—")}</td><td>${fmtMoney(g.costo)}</td><td>${g.fechaEntrega || "—"}</td>
        <td>${escAttr(g.registradoPor || "—")}</td><td>${acciones}</td>
      </tr>`;
    }).join("")}
  </table>`;
}

function bindGastos(onCambio){
  const refresh = () => {
    const fs = document.getElementById("fg-salon").value;
    const fm = document.getElementById("fg-mes").value;
    const fq = document.getElementById("fg-buscar").value;
    document.getElementById("gastos-tabla-wrap").innerHTML = renderTabla(fs, fm, fq);
    bindFilas(refresh, onCambio);
  };
  document.getElementById("fg-salon").onchange = refresh;
  document.getElementById("fg-mes").onchange = refresh;
  document.getElementById("fg-buscar").oninput = debounce(refresh, 250);
  bindFilas(refresh, onCambio);
}

function bindFilas(refresh, onCambio){
  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = () => {
      showConfirmModal("¿Eliminar este gasto? Esta acción no se puede deshacer.", async () => {
        try{
          await api.deleteGasto(btn.dataset.del);
          // Actualización optimista: ya no esperamos una segunda vuelta de
          // red para volver a traer la lista — el servidor ya confirmó el
          // borrado, así que lo quitamos de `state.gastos` aquí mismo y
          // refrescamos solo la tabla (refresh() ya preserva los filtros
          // que la persona tenía escritos, no los borra).
          const idx = state.gastos.findIndex(g => g.id === btn.dataset.del);
          if(idx !== -1) state.gastos.splice(idx, 1);
          refresh();
          onCambio(); // reconciliación de fondo, sin bloquear
        }catch(e){ showToast("No se pudo eliminar: " + e.message); }
      }, "Sí, eliminar");
    };
  });
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => {
      const g = state.gastos.find(x => x.id === btn.dataset.edit);
      if(g) showEditGastoModal(g, (cambios) => {
        Object.assign(g, cambios);
        refresh();
        onCambio(); // reconciliación de fondo, sin bloquear
      });
    };
  });
}

function showEditGastoModal(gasto, onSaved){
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <p class="section-title">Editar gasto</p>
      <div class="field"><label>Concepto</label><input id="eg-concepto" value="${escAttr(gasto.concepto)}"></div>
      <div class="grid grid-2">
        <div class="field"><label>Cantidad</label><input id="eg-cantidad" value="${escAttr(gasto.cantidad || "")}"></div>
        <div class="field"><label>Costo ($)</label><input id="eg-costo" type="number" min="0" step="0.01" value="${gasto.costo}"></div>
      </div>
      <div class="field"><label>Observación</label><textarea id="eg-obs" rows="2">${escAttr(gasto.observacion || "")}</textarea></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" id="eg-cancel" style="flex:1;">Cancelar</button>
        <button class="btn btn-primary" id="eg-guardar" style="flex:1;">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector("#eg-cancel").onclick = () => wrap.remove();
  wrap.querySelector("#eg-guardar").onclick = async () => {
    const costo = Number(wrap.querySelector("#eg-costo").value);
    if(!costo || costo <= 0){ showToast("El costo debe ser mayor a $0."); return; }
    const cambios = {
      concepto: wrap.querySelector("#eg-concepto").value.trim(),
      cantidad: wrap.querySelector("#eg-cantidad").value.trim(),
      costo,
      observacion: wrap.querySelector("#eg-obs").value.trim()
    };
    try{
      await api.updateGasto({ id: gasto.id, ...cambios });
      wrap.remove();
      showToast("Gasto actualizado.");
      onSaved(cambios); // el servidor ya confirmó — quien llamó actualiza `state` localmente con esto mismo
    }catch(e){ showToast("No se pudo guardar: " + e.message); }
  };
}

      const mes = input.dataset.mes;

      nuevos[salon][mes] = Number(input.value) || 0;
      try{
        await api.setPresupuestos(nuevos);
        state.config.presupuestos = nuevos;
        showToast("Presupuesto actualizado.");
        await onCambio(); // ya se actualizó `state.config.presupuestos` localmente arriba; esto solo reconcilia en segundo plano

    };
  });

function bindFondos(onCambio){
  function refrescar(){
    document.getElementById("fondos-vista").innerHTML = renderContenidoFondos();
    bindFondos(onCambio);
  }
  const btn = document.getElementById("fd-submit");
  if(btn) btn.onclick = async () => {
    const fecha = document.getElementById("fd-fecha").value;
    const monto = Number(document.getElementById("fd-monto").value);
    const concepto = document.getElementById("fd-concepto").value.trim();
    if(!fecha){ showToast("Indica la fecha de entrega."); return; }
    if(!monto || monto <= 0){ showToast("El monto debe ser mayor a $0."); return; }
    try{
      const res = await api.addFondo({ fecha, monto, concepto });
      // Actualización optimista: el servidor ya confirmó — se agrega
      // localmente y se refresca solo esta pestaña, sin una segunda vuelta
      // de red antes de que la persona vea su fondo reflejado.
      state.fondos.push({ id: res.id, fecha, monto, concepto, registradoEn: new Date().toISOString(), registradoPor: "Operaciones" });
      showToast("Fondo registrado.");
      refrescar();
      onCambio(); // reconciliación de fondo, sin bloquear
    }catch(e){ showToast("No se pudo registrar: " + e.message); }
  };
  document.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => {
      showConfirmModal("¿Eliminar este fondo?", async () => {
        try{
          await api.deleteFondo(b.dataset.del);
          const idx = state.fondos.findIndex(f => f.id === b.dataset.del);
          if(idx !== -1) state.fondos.splice(idx, 1);
          refrescar();
          onCambio(); // reconciliación de fondo, sin bloquear
        }catch(e){ showToast("No se pudo eliminar: " + e.message); }
      }, "Sí, eliminar");
    };
  });
}

// La librería de Excel pesa cerca de 1 MB — cargarla siempre al abrir la
// app frenaría a TODOS por una función que casi nadie usa en cada sesión.
// En vez de eso, se inyecta bajo demanda solo cuando de verdad se hace
// clic en "Descargar Excel completo", y queda en caché del navegador para
// la próxima vez.
let cargandoXLSX = null;
function cargarXLSX(){
  if(typeof XLSX !== "undefined") return Promise.resolve();
  if(cargandoXLSX) return cargandoXLSX;
  cargandoXLSX = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = () => resolve();
    script.onerror = () => { cargandoXLSX = null; reject(new Error("No se pudo descargar la librería de Excel.")); };
    document.head.appendChild(script);
  });
  return cargandoXLSX;
}

async function exportarExcel(){
  const boton = document.getElementById("rp-excel");
  boton.disabled = true;
  boton.textContent = "Preparando Excel…";
  try{
    await cargarXLSX();
    generarYDescargarExcel();
  }catch(e){
    showToast("No se pudo generar el Excel: " + e.message + " Revisa tu conexión a internet.");
  }
  boton.disabled = false;
  boton.textContent = "Descargar Excel completo";
}

function generarYDescargarExcel(){
  const wb = XLSX.utils.book_new();

  const gastosRows = state.gastos.map(g => ({
    Salón: g.salon, Mes: g.mes, Concepto: g.concepto, Cantidad: g.cantidad, Costo: Number(g.costo) || 0,
    "Fecha pedido": g.fechaPedido, "Fecha entrega": g.fechaEntrega,
    "Avisó con anticipación": g.avisoAnticipado ? "Sí" : "No", Observación: g.observacion,
    "Registrado en": g.registradoEn, "Registró": g.registradoPor, Rol: g.registradoRol
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gastosRows), "Gastos");

  const fondosRows = state.fondos.map(f => ({ Fecha: f.fecha, Monto: Number(f.monto) || 0, Concepto: f.concepto, "Registrado en": f.registradoEn, "Registró": f.registradoPor }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fondosRows), "Fondos");

  const resumenRows = state.config.salones.map(s => {
    const fila = { Salón: s };
    state.mesesCiclo.forEach(m => fila[m] = totalGastado(s, m));
    fila["Total ciclo"] = totalGastadoCiclo(s);
    return fila;
  });
  resumenRows.push({ Salón: "TOTAL GENERAL", "Total ciclo": totalGastoGeneral() });
  resumenRows.push({ Salón: "Fondos recibidos", "Total ciclo": totalFondosRecibidos() });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumenRows), "Resumen");

  XLSX.writeFile(wb, `Caja_Chica_${state.config.ciclo}.xlsx`);
}

function abrirReporteMes(mes){
  const salones = state.config.salones;
  const filas = salones.map(s => {
    const gastos = gastosDeSalonMes(s, mes);
    if(gastos.length === 0) return "";
    return `<h3>${escAttr(s)} — ${fmtMoney(totalGastado(s, mes))}</h3>
      <table><tr><th>Concepto</th><th>Cant.</th><th>Costo</th><th>Entrega</th></tr>
      ${gastos.map(g => `<tr><td>${escAttr(g.concepto)}</td><td>${escAttr(g.cantidad || "—")}</td><td>${fmtMoney(g.costo)}</td><td>${g.fechaEntrega || "—"}</td></tr>`).join("")}
      </table>`;
  }).join("");
  abrirVentanaReporte(`Reporte de ${mes} — Ciclo ${state.config.ciclo}`, filas || `<p>No hay gastos registrados en ${mes}.</p>`);
}

function abrirReporteSalon(salon){
  const gastos = gastosDeSalon(salon).slice().sort((a, b) => (a.mes || "").localeCompare(b.mes || ""));
  const cuerpo = gastos.length === 0 ? `<p>No hay gastos registrados para ${escAttr(salon)}.</p>` : `
    <p><strong>Total del ciclo:</strong> ${fmtMoney(totalGastadoCiclo(salon))}</p>
    <table><tr><th>Mes</th><th>Concepto</th><th>Cant.</th><th>Costo</th><th>Entrega</th></tr>

function abrirVentanaReporte(titulo, cuerpoHTML){
  const ventana = window.open("", "_blank");
  if(!ventana){ showToast("El navegador bloqueó la ventana emergente. Permite ventanas emergentes para este sitio e inténtalo de nuevo."); return; }
  const tituloSeguro = escAttr(titulo);
  ventana.document.write(`
    <html><head><title>${tituloSeguro}</title>
    <style>
      body{font-family:Arial,sans-serif;color:#201F16;padding:30px;max-width:800px;margin:0 auto;}
      h1{font-size:20px;} h3{font-size:15px;margin-top:26px;color:#2E3010;}
      table{width:100%;border-collapse:collapse;margin-top:8px;}
      th,td{border-bottom:1px solid #DDD8C4;padding:8px;text-align:left;font-size:13px;}
      th{color:#75736A;}
    </style></head>
    <body>
      <h1>${tituloSeguro}</h1>
      ${cuerpoHTML}
      <script>window.onload = () => window.print();<\/script>
    </body></html>`);
  ventana.document.close();
}

function renderHistorial(){

    <div class="field"><label><input type="checkbox" id="hc-limpiar" style="width:auto;display:inline-block;margin-right:6px;">Vaciar gastos y fondos para empezar un ciclo nuevo</label></div>
    <div class="field" id="hc-nuevo-ciclo-wrap" style="display:none;"><label>Nombre del nuevo ciclo</label><input id="hc-nuevo-ciclo" placeholder="Ej. 2027-2028"></div>

  </div>`}
  <div class="card" style="overflow-x:auto;">
    <p class="section-title">Cierres anteriores</p>
    ${lista.length === 0 ? `<div class="empty">Todavía no se ha cerrado ningún ciclo.</div>` : `
    <table>
      <tr><th>Ciclo</th><th>Fecha de cierre</th><th>Cerró</th><th>Gasto total</th><th>Fondos totales</th><th></th></tr>
      ${lista.map(h => {
        const totalGasto = (h.snapshot.gastos || []).reduce((a, g) => a + (Number(g.costo) || 0), 0);
        const totalFondos = (h.snapshot.fondos || []).reduce((a, f) => a + (Number(f.monto) || 0), 0);
        const esElMasReciente = masReciente && h.id === masReciente.id;
        const puedeDeshacer = !soloLectura && esElMasReciente && h.seVacio;
        return `<tr>
          <td>${escAttr(h.cicloCerrado)}</td>
          <td>${h.fechaCierre ? new Date(h.fechaCierre).toLocaleString("es-MX") : "—"}</td>
          <td>${escAttr(h.cerradoPor || "—")}</td>
          <td>${fmtMoney(totalGasto)}</td>
          <td>${fmtMoney(totalFondos)}</td>
          <td>
            <button class="link-btn" data-ver="${h.id}">Ver detalle</button>
            ${puedeDeshacer ? ` · <button class="link-btn" data-deshacer="${h.id}">Deshacer</button>` : ""}
          </td>
        </tr>`;
      }).join("")}
    </table>`}
  </div>`;
}

function bindHistorial(onCambio){
  const checkLimpiar = document.getElementById("hc-limpiar");
  if(checkLimpiar){
    checkLimpiar.onchange = () => {
      document.getElementById("hc-nuevo-ciclo-wrap").style.display = checkLimpiar.checked ? "block" : "none";
    };
  }
  const btnCerrar = document.getElementById("hc-cerrar");
  if(btnCerrar){
    btnCerrar.onclick = () => {
      const limpiar = checkLimpiar.checked;
      const nuevoCiclo = document.getElementById("hc-nuevo-ciclo").value.trim();
      if(limpiar && !nuevoCiclo){ showToast("Escribe el nombre del nuevo ciclo."); return; }
      showConfirmModal(`
        <p><strong>¿Cerrar el ciclo ${state.config.ciclo}?</strong></p>
        <p class="small-muted">Se guardará una copia completa en el historial.${limpiar ? ` Después se vaciarán los gastos y fondos actuales, y el ciclo pasará a llamarse "${escAttr(nuevoCiclo)}".` : " Los datos actuales se quedan tal cual, solo se guarda una copia adicional."}</p>
      `, async () => {
        try{
          await api.cerrarCiclo({ cerradoPor: state.role === "operaciones" ? "Operaciones" : "Dirección", limpiarParaNuevoCiclo: limpiar, nuevoCiclo });
          showToast("Ciclo cerrado y guardado en el historial.");
          await onCambio();
        }catch(e){ showToast("No se pudo cerrar el ciclo: " + e.message); }
      }, "Sí, cerrar ciclo");
    };
  }

  document.querySelectorAll("[data-ver]").forEach(btn => {
    btn.onclick = () => verDetalleCierre(btn.dataset.ver);
  });
  document.querySelectorAll("[data-deshacer]").forEach(btn => {
    btn.onclick = () => {
      showConfirmModal(`
        <p><strong>¿Deshacer este cierre de ciclo?</strong></p>
        <p class="small-muted">Se restaurarán los gastos, fondos y presupuestos exactamente como estaban en ese momento, y este cierre desaparecerá del historial. Solo se puede deshacer el cierre más reciente.</p>
      `, async () => {
        try{
          await api.revertirCierre(btn.dataset.deshacer);

          await onCambio();
        }catch(e){ showToast("No se pudo deshacer: " + e.message); }
      }, "Sí, deshacer");
    };
  });
}

function verDetalleCierre(id){
  const h = state.historial.find(x => x.id === id);
  if(!h) return;
  const gastos = (h.snapshot.gastos || []).slice().sort((a, b) => (a.salon || "").localeCompare(b.salon || ""));
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal" style="max-width:700px;max-height:80vh;overflow:auto;">
      <p class="section-title">Detalle del cierre — ${escAttr(h.cicloCerrado)}</p>

}

function listaObservaciones(){

function renderObservacionesSalon(salon){
  const lista = state.observaciones.filter(o => o.salon === salon).slice().sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  if(lista.length === 0) return `<div class="empty">No hay observaciones para tu salón.</div>`;
  return `<table>

    ${lista.map(o => `<tr><td>${o.fecha ? new Date(o.fecha).toLocaleDateString("es-MX") : "—"}</td><td>${escAttr(o.texto)}</td></tr>`).join("")}
  </table>`;
}

function bindObservaciones(onCambio){
  function refrescar(){
    document.getElementById("obs-vista").innerHTML = renderContenidoObservaciones();
    bindObservaciones(onCambio);
  }
  const btn = document.getElementById("ob-agregar");
  if(btn){
    btn.onclick = async () => {
      const salon = document.getElementById("ob-salon").value;
      const texto = document.getElementById("ob-texto").value.trim();
      if(!texto){ showToast("Escribe la observación antes de guardarla."); return; }
      try{
        const res = await api.addObservacion({ salon, texto, autor: "Operaciones" });
        state.observaciones.push({ id: res.id, salon, texto, fecha: new Date().toISOString(), autor: "Operaciones", rol: "operaciones" });
        showToast("Observación agregada.");
        refrescar();
        onCambio(); // reconciliación de fondo, sin bloquear
      }catch(e){ showToast("No se pudo guardar: " + e.message); }
    };
  }
  document.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => {
      showConfirmModal("¿Eliminar esta observación?", async () => {
        try{
          await api.deleteObservacion(b.dataset.del);
          const idx = state.observaciones.findIndex(o => o.id === b.dataset.del);
          if(idx !== -1) state.observaciones.splice(idx, 1);
          refrescar();
          onCambio(); // reconciliación de fondo, sin bloquear
        }catch(e){ showToast("No se pudo eliminar: " + e.message); }
      }, "Sí, eliminar");
    };
  });
}

// PUNTO DE ENTRADA / ENRUTADOR
// (antes: js/main.js)
// ============================================================
const root = document.getElementById("app");

async function cargarTodo(){
  const data = await api.obtenerTodo();
  state.config = data.config;
  state.gastos = data.gastos;
  state.fondos = data.fondos;
  state.observaciones = data.observaciones;
  state.historial = data.historial;
}

async function refrescarYRenderizar(recargar = true){
  if(recargar){
    try{ await cargarTodo(); }
    catch(e){ showToast("No se pudo conectar con el servidor: " + e.message); }
  }
  render();
}

// ---------------------------- Actualización optimista ----------------------------
// Patrón usado tras un guardado exitoso: la vista que guardó algo (registrar,
// editar, eliminar) ya mutó `state` localmente con el resultado que el
// servidor confirmó — así que renderizamos DE INMEDIATO con eso, sin esperar
// una segunda vuelta de red solo para volver a traer lo que ya sabemos.
// Justo después, en segundo plano y sin bloquear ni mostrar "cargando",
// reconciliamos con el servidor por si algo más cambió mientras tanto (por
// ejemplo, otra persona guardando algo distinto casi al mismo tiempo).
// Esto es lo que hace que guardar se sienta instantáneo sin sacrificar que
// los datos terminen consistentes con el servidor.
let sincronizando = false;
function actualizarYSincronizar(){
  render();
  sincronizarEnSegundoPlano();
}
async function sincronizarEnSegundoPlano(){
  if(sincronizando) return; // si ya hay una reconciliación en curso, no encimar otra
  sincronizando = true;
  try{
    await cargarTodo();
    render(); // vuelve a dibujar ya con los datos reconciliados del servidor
  }catch(e){
    // Silencioso a propósito: es una reconciliación de fondo. La persona ya
    // vio su cambio reflejado; un error de red aquí no debe interrumpirla.
    console.warn("No se pudo reconciliar en segundo plano:", e.message);
  }
  sincronizando = false;
}

// ---------------------------- Sincronización periódica en segundo plano ----------------------------
// La reconciliación de arriba solo se dispara después de que TÚ guardas algo.
// Pero si la otra persona (Operaciones o Dirección) registra algo mientras tú
// solo estás viendo el Resumen, tu pantalla se quedaría desactualizada hasta
// que hagas tú misma alguna acción. Este intervalo cierra ese hueco: cada 45
// segundos, si no hay riesgo de interrumpir a nadie, refresca en silencio.
const INTERVALO_SINCRONIZACION_MS = 45000;
function debeEvitarSincronizacionAhora(){
  if(!state.role) return true;                          // todavía en la pantalla de acceso
  if(state.tab === "registrar") return true;             // no pisar una lista de insumos a medio capturar
  if(document.querySelector(".modal-bg")) return true;   // no pisar un modal abierto (edición, confirmación)
  return false;
}
setInterval(() => {
  if(debeEvitarSincronizacionAhora()) return;
  sincronizarEnSegundoPlano();
}, INTERVALO_SINCRONIZACION_MS);

function render(){
  if(!state.role){
    root.innerHTML = renderRoleChoice();
    bindRoleChoice(async () => {
      if(state.role === "tutor"){ render(); return; }
      await refrescarYRenderizar();
    });
    return;
  }
  if(state.role === "tutor" && !state.salon){
    // El listado de salones se pudo cargar antes de elegir rol, o hay que traerlo ahora
    if(state.config.salones.length === 0){
      root.innerHTML = `<div class="acceso-wrap"><p class="small-muted">Cargando…</p></div>`;
      cargarTodo().then(render);
      return;
    }
    root.innerHTML = renderSalonChoice(state.config.salones);
    bindSalonChoice(render);
    return;
  }

  root.innerHTML = renderTopbar() + renderCuerpo();
  bindTopbar();
  bindCuerpo();
}

function renderTopbar(){
  const roleLabel = state.role === "operaciones" ? "Operaciones" : state.role === "direccion" ? "Dirección" : `Tutor · ${state.salon}`;
  const tabs = tabsDisponibles();
  return `
  <div class="topbar">
    <div class="brand">${LOGO_BASE64 ? `<img src="${LOGO_BASE64}" alt="Logo de la escuela" class="logo-topbar">` : ""}<h1>Caja Chica</h1><span>Ciclo ${state.config.ciclo}</span></div>
    <div class="role-pill"><span>${roleLabel}</span><button id="btn-cambiar-rol">cambiar</button></div>
  </div>
  ${tabs.length > 1 ? `<div class="tabs">${tabs.map(([k, label]) => `<button class="tab ${state.tab === k ? "activo" : ""}" data-tab="${k}">${label}</button>`).join("")}</div>` : ""}
  `;
}

function tabsDisponibles(){
  if(state.role === "tutor") return [["gastos", "Mi salón"]];
  const soloLectura = esSoloLectura();
  const tabs = [
    ["resumen", "Resumen"], ["registrar", "Registrar compra"], ["presupuestos", "Presupuestos"],
    ["fondos", "Fondos"], ["gastos", "Todos los gastos"], ["reportes", "Reportes"],
    ["historial", "Historial de ciclos"], ["observaciones", "Observaciones"]
  ];
  if(!soloLectura) tabs.push(["ajustes", "Ajustes"]);
  return tabs;
}

function renderCuerpo(){
  if(state.role === "tutor") return `<div class="contenido">${renderTutor()}</div>`;
  let html;
  switch(state.tab){
    case "registrar": html = renderRegistrar(); break;
    case "presupuestos": html = renderPresupuestos(); break;
    case "fondos": html = renderFondos(); break;
    case "gastos": html = renderGastos(); break;
    case "reportes": html = renderReportes(); break;
    case "historial": html = renderHistorial(); break;
    case "observaciones": html = renderObservaciones(); break;
    case "ajustes": html = esSoloLectura() ? renderResumen() : renderAjustes(); break;
    default: html = renderResumen();
  }
  return `<div class="contenido">${html}</div>`;
}

function bindTopbar(){
  document.getElementById("btn-cambiar-rol").onclick = async () => {
    try{ await api.logout(); }catch(e){ /* no pasa nada si ya expiró */ }
    cerrarSesionLocal();
    state.role = null; state.salon = null; state.tab = "resumen";
    render();
  };
  document.querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });
}

function bindCuerpo(){
  if(state.role === "tutor") return;
  switch(state.tab){
    case "registrar": bindRegistrar(() => actualizarYSincronizar()); break;
    case "presupuestos": bindPresupuestos(() => actualizarYSincronizar()); break;
    case "fondos": bindFondos(() => actualizarYSincronizar()); break;
    case "gastos": bindGastos(() => actualizarYSincronizar()); break;
    case "reportes": bindReportes(); break;
    case "historial": bindHistorial(() => refrescarYRenderizar()); break;
    case "observaciones": bindObservaciones(() => actualizarYSincronizar()); break;
    case "ajustes": if(!esSoloLectura()) bindAjustes(() => refrescarYRenderizar()); break;
  }
}

// ---------------------------- Arranque ----------------------------
(async function iniciar(){
  const sesion = getSesion();
  // Si la carga inicial se tarda de forma anormal (más de 6s), es casi
  // siempre la implementación de Apps Script en arranque en frío — no hay
  // nada que el sitio pueda hacer para acelerar eso, pero sí puede avisar
  // en vez de dejar la pantalla de "Cargando…" sin explicación.
  const avisoTardanza = setTimeout(() => {
    const p = document.querySelector(".acceso-wrap p.small-muted");
    if(p) p.textContent = "Esto está tardando más de lo normal — Google Apps Script a veces tarda unos segundos en \"despertar\". Sigue esperando un momento más.";
  }, 6000);
  try{
    await cargarTodo();
  }catch(e){
    clearTimeout(avisoTardanza);
    root.innerHTML = `<div class="acceso-wrap"><div class="acceso-card" style="text-align:left;max-width:480px;">
      <p class="section-title" style="color:#A6453D;">No se pudo conectar con el backend</p>
      <p style="font-size:13.5px;line-height:1.5;">${e.message}</p>
      <button class="btn btn-secondary" id="reintentar-carga" style="margin-top:10px;width:100%;">Reintentar</button>
    </div></div>`;
    const btn = document.getElementById("reintentar-carga");
    if(btn) btn.onclick = () => { root.innerHTML = `<div class="acceso-wrap"><p class="small-muted">Cargando…</p></div>`; iniciar(); };
    return;
  }
  clearTimeout(avisoTardanza);
  if(sesion.token && sesion.role){
    state.role = sesion.role;
    state.tab = "resumen";
  }
  render();
})();
  </script>
